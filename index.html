<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nido · Bebè</title>
<meta name="theme-color" content="#eef7ef" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Nido" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#eef7ef; --bg2:#e0f0e3; --surface:#ffffff;
    --ink:#26342a; --ink-soft:#6a7d70; --line:#dceadf;
    --sage:#4fa269; --sage-bg:#e6f4ea; --sage-soft:#a3d5b0;
    --butter:#f4cd78; --coral:#ef9a85; --sky:#8ec5e8;
    --shadow-soft:0 6px 20px rgba(38,52,42,.07);
    --r:22px;
    /* Percorso sensoriale: 6 tappe distinte, tonalità della palette Nido */
    --pc1:#aacfe6; --pc2:#a6d6b6; --pc3:#f4cd78; --pc4:#f3b79c; --pc5:#e8a6b2; --pc6:#c3aedd;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:120px}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  /* intestazione */
  header{padding:calc(env(safe-area-inset-top) + 8px) 0 2px;text-align:center;position:relative}
  .logo{width:52px;height:52px;margin:0 auto 4px;border-radius:17px;background:var(--sage-bg);
    display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow-soft)}
  h1{font-family:'Quicksand';font-weight:700;font-size:23px;letter-spacing:-.4px}
  .baby{font-family:'Quicksand';font-weight:700;font-size:17px;color:var(--sage);margin-top:1px;letter-spacing:-.2px}
  .age{font-family:'Quicksand';font-weight:600;font-size:12.5px;color:var(--ink-soft);margin-top:0}
  .birth{color:var(--ink-soft);font-size:11.5px;margin-top:5px;line-height:1.35;opacity:.85}
  .sub{color:var(--ink-soft);font-size:12.5px;margin-top:4px;opacity:.85}
  .appver{color:var(--ink-soft);font-size:10px;opacity:.5;margin-top:3px;letter-spacing:.5px}
  .sync{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;
    padding:4px 10px;font-size:11px;color:var(--ink-soft);box-shadow:var(--shadow-soft);
    position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 8px);margin-top:0;z-index:3;max-width:44vw}
  .sync #syncTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sync .d{width:9px;height:9px;border-radius:50%;background:var(--butter)}
  .sync .d.on{background:var(--sage)} .sync .d.off{background:var(--coral)}
  .share-btn{display:inline-flex;align-items:center;gap:7px;margin-top:8px;border:none;cursor:pointer;
    background:var(--sage);color:#fff;border-radius:99px;padding:9px 18px;
    font-family:'Quicksand';font-weight:700;font-size:13.5px;box-shadow:var(--shadow-soft)}
  .share-btn:active{transform:scale(.96)}
  #notifBtn{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 8px);margin-top:0;
    z-index:3;padding:6px 12px;font-size:12px;max-width:44vw}
  .exp-seg{display:flex;gap:6px;margin:14px 0 4px}
  .exp-seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:13px;padding:9px;border-radius:12px;cursor:pointer}
  .exp-seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .exp-box{width:100%;height:280px;border:1.5px solid var(--line);border-radius:16px;padding:14px;
    background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
    line-height:1.5;white-space:pre-wrap;overflow-y:auto;resize:none;-webkit-user-select:text;user-select:text}
  .exp-actions{display:flex;gap:10px;margin-top:16px}
  .exp-actions button{flex:1;border:none;border-radius:16px;padding:15px;cursor:pointer;
    font-family:'Quicksand';font-weight:700;font-size:15px}
  .exp-actions .prim{background:var(--sage);color:#fff}
  .exp-actions .sec{background:var(--sage-bg);color:var(--sage)}
  .hdr-actions{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .hdr-actions .share-btn{margin-top:0}
  /* Documenti */
  .doc-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .doc-row:last-of-type{border-bottom:none}
  .doc-row .di{font-size:23px;width:42px;height:42px;flex:none;display:grid;place-items:center;background:var(--sage-bg);border-radius:12px}
  .doc-row .dn{flex:1;min-width:0}
  .doc-row .dn b{font-family:'Quicksand';font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc-row .dn span{font-size:12px;color:var(--ink-soft)}
  .doc-row .dd{border:none;background:none;font-size:16px;padding:6px;cursor:pointer;opacity:.5;flex:none}
  .doc-add{display:block;width:100%;margin-top:12px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;
    background:var(--surface);color:var(--sage);font-family:'Quicksand';font-weight:700;font-size:15px;cursor:pointer}
  .docview{position:fixed;inset:0;z-index:400;background:#eef1ee;display:flex;flex-direction:column}
  .docview[hidden]{display:none}
  .dv-bar{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#fff;box-shadow:var(--shadow-soft);flex:none}
  .dv-close{border:none;background:var(--sage);color:#fff;padding:9px 16px;border-radius:99px;font-family:'Quicksand';font-weight:700;font-size:14px;cursor:pointer}
  .dv-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#dfe4e0}
  .dv-center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:10px}
  .dv-center img{max-width:100%;height:auto}
  .pdfwrap{padding:10px 8px 20px}
  .pdfwrap canvas{display:block;width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 1px 5px rgba(38,52,42,.18);border-radius:2px}
  .dv-msg{color:var(--ink-soft);padding:34px 24px;text-align:center;font-size:14.5px;line-height:1.5}
  .share-btn.alt{background:var(--surface);color:var(--sage);box-shadow:var(--shadow-soft)}
  /* grafico */
  .ch-legend{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 6px}
  .ch-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);
    color:var(--ink-soft);border-radius:99px;padding:7px 12px;font-family:'Quicksand';font-weight:600;font-size:12.5px;cursor:pointer}
  .ch-chip .dot{width:11px;height:11px;border-radius:50%;background:currentColor}
  .ch-chip.on{color:#fff}
  .ch-wrap{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:8px 6px 4px;overflow-x:auto}
  .ch-wrap svg{display:block;width:100%;height:auto}
  .ch-empty{text-align:center;color:var(--ink-soft);padding:30px 16px;font-size:14px}

  /* macro */
  .macro{display:flex;gap:5px;background:var(--surface);border-radius:var(--r);padding:6px;
    margin:20px 0 6px;box-shadow:var(--shadow-soft)}
  .macro button{flex:1;border:none;background:none;font-family:'Quicksand';font-weight:600;font-size:13px;
    color:var(--ink-soft);padding:11px 3px;border-radius:16px;cursor:pointer;transition:.18s;white-space:nowrap}
  .macro button.active{background:var(--sage);color:#fff}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;margin:0 -18px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:999px;cursor:pointer;transition:.18s}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip-x{margin-left:7px;font-size:12px;opacity:.75}
  .chip-add,.chip-edit{border-style:dashed}
  .chip-edit.active{background:var(--sage);border-color:var(--sage)}

  /* card generica */
  .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-soft);margin:14px 0;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer}
  .card-emoji{font-size:23px;width:42px;height:42px;display:grid;place-items:center;background:var(--sage-bg);border-radius:14px;flex:none}
  .card-title{flex:1;min-width:0}
  .card-title h2{font-family:'Quicksand';font-weight:600;font-size:17px;line-height:1.2}
  .card-title .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .card-count{font-family:'Quicksand';font-weight:600;font-size:13px;color:var(--ink-soft);flex:none}
  .card-del{border:none;background:none;font-size:18px;padding:4px 6px;cursor:pointer;flex:none}
  /* linguette da schedario: si sovrappongono leggermente, come le cartelline */
  .rem{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--sage-soft);
    border-radius:18px;padding:12px 14px;margin-top:16px;box-shadow:var(--shadow-soft)}
  .rem.done{border-color:var(--line);opacity:.8}
  .rem.info{display:block;text-align:center;color:var(--ink-soft);font-size:13px;border-style:dashed;border-color:var(--line);line-height:1.4}
  .rem-ic{font-size:24px;width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--sage-bg);border-radius:14px}
  .rem-tx{flex:1;min-width:0}
  .rem-tx b{font-family:'Quicksand';font-weight:700;font-size:15px;display:block}
  .rem-tx span{font-size:12.5px;color:var(--ink-soft)}
  .rem-btn{border:none;background:var(--sage);color:#fff;border-radius:12px;padding:9px 14px;flex:none;
    font-family:'Quicksand';font-weight:700;font-size:13.5px;cursor:pointer}
  .rem-btn.ghost{background:var(--sage-bg);color:var(--sage)}
  .rem-btn:active{transform:scale(.95)}
  /* schede in GRIGLIA: 3 per riga, più larghe; le nuove vanno in righe da 3 */
  .schede{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
  .scheda{background:var(--catbg,var(--bg2));border:1.5px solid transparent;border-radius:15px;padding:11px 6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0;position:relative;
    box-shadow:var(--shadow-soft);transition:.16s}
  .scheda:active{transform:scale(.97)}
  .scheda .ic{font-size:22px;line-height:1.1}
  .scheda .ti{font-family:'Quicksand';font-weight:700;font-size:13px;color:var(--cat,var(--ink-soft));line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .scheda .nm{font-size:11px;color:var(--ink-soft);opacity:.8;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .scheda:not(.on){opacity:.85}
  .scheda.on{border-color:var(--cat);box-shadow:0 3px 11px rgba(38,52,42,.14)}
  .scheda.on .ti{color:var(--cat)}
  .scheda.on .nm{opacity:1;color:var(--cat)}
  .reord{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
  .reord-row{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .re-ic{font-size:22px;width:34px;text-align:center;flex:none}
  .re-nm{flex:1;min-width:0;font-family:'Quicksand';font-weight:600;font-size:15px}
  .re-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;
    font-size:15px;cursor:pointer;flex:none;color:var(--ink)}
  .re-btn:disabled{opacity:.3}
  .re-btn:active:not(:disabled){background:var(--sage-bg)}
  .icgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .icgrid button{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;
    font-size:19px;cursor:pointer;display:grid;place-items:center}
  .icgrid button.on{border-color:var(--sage);background:var(--sage-bg)}
  .scheda.dragging{z-index:60;transform:scale(1.08) translateY(-4px);box-shadow:0 8px 18px rgba(38,52,42,.22);opacity:.96}
  .scheda.addtab{background:var(--surface);border:1.5px dashed var(--line);opacity:.9}
  .scheda.addtab .ic{color:var(--sage);font-weight:700}
  .scheda.addtab .ti{color:var(--sage)}
  .card.cat{background:var(--catbg);border-top:2.5px solid var(--cat)}
  .card.cat .card-emoji{background:#fff}
  .card.cat .ev{border-bottom-color:rgba(38,52,42,.08)}
  .card.cat .ev .dot{background:#fff}
  .card.cat .sez-add{background:var(--cat)}
  /* il foglio sotto le linguette */
  .schede + .card{margin-top:0;border-top-left-radius:4px}
  .sez-add{border:none;background:var(--sage);color:#fff;width:34px;height:34px;border-radius:12px;
    font-size:22px;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center}
  .sez-add:active{transform:scale(.92)}
  .chev{color:var(--ink-soft);font-size:19px;transition:transform .2s;flex:none;width:18px;text-align:center}
  .chev.up{transform:rotate(180deg)}
  .ev .dot{font-family:'Quicksand';font-weight:700;font-size:12px;color:var(--ink-soft)}

  /* ---- BEBÈ: registro ---- */
  .bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .bigbtn{border:none;border-radius:20px;padding:18px 12px;cursor:pointer;color:#fff;
    font-family:'Quicksand';font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:var(--shadow-soft);transition:transform .12s}
  .bigbtn:active{transform:scale(.97)}
  .bigbtn .ico{font-size:26px}
  .bigbtn.pipi{background:var(--butter);color:#5c4611}
  .bigbtn.pupu{background:#c9a227;color:#fff}
  .bigbtn.both{background:var(--coral)}
  .bigbtn.feed{background:var(--sage)}
  .bigbtn.vomit{background:#b98a5e}
  .bigbtn.weight{background:#7fa8c9}
  .today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{background:var(--surface);border-radius:18px;padding:13px 10px;text-align:center;box-shadow:var(--shadow-soft)}
  .stat b{display:block;font-family:'Quicksand';font-weight:700;font-size:24px;line-height:1.1}
  .stat span{font-size:11.5px;color:var(--ink-soft)}
  .ev{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--sage-bg)}
  .ev .txt{flex:1;min-width:0}
  .ev .txt b{font-family:'Quicksand';font-weight:600;font-size:15px}
  .ev .txt span{display:block;font-size:12.5px;color:var(--ink-soft)}
  .ev .time{font-family:'Quicksand';font-weight:600;font-size:14px;color:var(--ink-soft);flex:none}
  .ev .del{border:none;background:none;font-size:16px;padding:4px;cursor:pointer;opacity:.5}
  /* pesata di DOMENICA: riga evidenziata (checkpoint settimanale) */
  .ev.sun{background:#fff7e6;box-shadow:inset 4px 0 0 #e0a92e}
  .card.cat .ev.sun .dot{background:#e0a92e;color:#fff}
  .ev.sun .txt b{color:#8a6410}
  .wk{flex:none;font-family:'Quicksand';font-weight:800;font-size:15px;text-align:center;line-height:1.02;
    padding:6px 11px;border-radius:12px;min-width:66px}
  .wk small{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:9px;
    letter-spacing:.4px;text-transform:uppercase;opacity:.85;margin-top:2px}
  .wk.up{background:#e3f3e6;color:#2f7247}
  .wk.down{background:#fbe4e4;color:#b23b3b}
  .wk.first{background:var(--sage-bg);color:var(--ink-soft);font-weight:700;font-size:14px}
  .tocca{cursor:pointer}
  .ev.tocca:active{background:rgba(0,0,0,.03)}
  .row .t.tocca:active{opacity:.6}
  .daylabel{font-family:'Quicksand';font-weight:700;font-size:13px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.6px;margin:22px 2px 8px}

  /* ---- compiti / liste ---- */
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .cb{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--sage-soft);background:var(--surface);
    flex:none;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .cb.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .row .t{flex:1;min-width:0;font-size:15px}
  .row.done .t{color:var(--ink-soft);text-decoration:line-through}
  .who{font-family:'Quicksand';font-weight:600;font-size:11.5px;padding:3px 9px;border-radius:99px;flex:none}
  .who.fede{background:#e3eefb;color:#2d5f92} .who.sara{background:#fbe8ef;color:#9c3d64}
  .who.tutti{background:var(--sage-bg);color:var(--sage)}
  .row .del{border:none;background:none;font-size:15px;padding:4px;cursor:pointer;opacity:.45}
  .add{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;
    font-family:'Inter';font-size:15px;background:var(--bg);outline:none}
  .add input:focus{border-color:var(--sage-soft)}
  .add button{border:none;background:var(--sage);color:#fff;border-radius:14px;width:46px;font-size:22px;cursor:pointer;flex:none}
  .seg{display:flex;gap:6px;padding:0 16px 12px}
  .seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:13px;padding:8px;border-radius:12px;cursor:pointer}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .add-card{display:block;width:100%;margin:14px 0 4px;padding:15px;border:1.5px dashed var(--line);
    border-radius:var(--r);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:15px;cursor:pointer}
  .empty{text-align:center;color:var(--ink-soft);padding:34px 20px;font-size:14.5px}
  .empty .e{font-size:38px;display:block;margin-bottom:10px}

  /* foglio poppata */
  .scrim{position:fixed;inset:0;background:rgba(38,52,42,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
  .scrim.on{display:flex}
  .sheet{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:560px;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.22,1,.36,1);
    max-height:88dvh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h3{font-family:'Quicksand';font-weight:700;font-size:20px;text-align:center;margin-bottom:4px}
  .sheet .hint{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
  .lbl{font-family:'Quicksand';font-weight:700;font-size:12px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
  .opts{display:flex;gap:8px}
  .opts button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
    font-family:'Quicksand';font-weight:600;font-size:14.5px;padding:13px 8px;border-radius:15px;cursor:pointer}
  .opts button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .fld{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;background:var(--bg)}
  .fld input{flex:1;border:none;background:none;outline:none;padding:13px 0;font-family:'Inter';font-size:16px;color:var(--ink)}
  .fld .u{color:var(--ink-soft);font-size:14px}
  .sheet .go{width:100%;border:none;background:var(--sage);color:#fff;border-radius:16px;padding:16px;
    font-family:'Quicksand';font-weight:700;font-size:16px;margin-top:22px;cursor:pointer}
  .sheet .cancel{width:100%;border:none;background:none;color:var(--ink-soft);padding:12px;margin-top:4px;

  .pc-check label{display:flex;gap:12px;align-items:flex-start;padding:14px 0;cursor:pointer;min-height:58px}
  .pc-check input{position:absolute;opacity:0;width:1px;height:1px}
  .pc-box{width:25px;height:25px;border-radius:9px;border:2px solid var(--line);flex:none;margin-top:1px;
    display:grid;place-items:center;transition:background .2s,border-color .2s}
  .pc-box svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:.2s;color:#fff}

  .pc-check input:checked + .pc-box svg{opacity:1;transform:scale(1)}
  .pc-check input:checked ~ .pc-tx{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line)}
  .pc-tx{font-size:14.5px;line-height:1.4}
  .pc-rule{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-soft);padding:0 16px;margin-bottom:10px}
  .pc-rule summary{padding:15px 0;font-family:'Quicksand';font-weight:700;font-size:15px;cursor:pointer;
    list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:54px}
  .pc-rule summary::-webkit-details-marker{display:none}
  .pc-rule summary::after{content:"+";font-family:'Quicksand';font-size:21px;color:var(--ink-soft)}

  .pc-rule ul{margin:0 0 14px;padding-left:19px;color:var(--ink-soft);font-size:14px}

  @media (max-width:380px){ .pc-stage .l{font-size:9.5px} .pc-body{padding-left:0} }

<script>
/* ============ Dati ============ */
const KEY="nido_v1";
let mem=null;
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return mem; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ mem=state; } scheduleCloudPush(); }

const DEFAULT_LISTS=[
  {id:"farmacia",  emoji:"💊", name:"Farmacia",  items:[]},
  {id:"cibo",      emoji:"🥣", name:"Cibo",      items:[]},
  {id:"accessori", emoji:"🧸", name:"Accessori", items:[]},
  {id:"vestiti",   emoji:"👕", name:"Vestiti",   items:[]}
];

let state = load() || {};
state.events = state.events || [];      // {id, type:'diaper'|'feed', at, kind, mode, side, ml, min, note}
state.tasks  = state.tasks  || [];      // {id, text, who:'fede'|'sara'|'tutti', done, at}
state.lists  = state.lists  || JSON.parse(JSON.stringify(DEFAULT_LISTS));
state.weights= state.weights|| [];      // {id, kg, at, note}
state.open   = state.open   || {};
state.openBebe= state.openBebe|| {};
state.customTabs = state.customTabs || [];  // schede aggiunte da noi: {id,emoji,name,bg,fg,from?}
state.tabOrder = state.tabOrder || [];  // ordine delle schede (chiavi) scelto da noi
state.deleted = state.deleted || {};    // tombstone: {id: timestamp} degli elementi cancellati
state.docs = state.docs || [];          // metadati documenti condivisi: {id,name,type,size,at,sp} (file su Storage)
state.numbers = state.numbers || [];    // numeri utili: {id, name, tel, at}
state.percorso = state.percorso || { sel:0, tab:"senses", open:{}, done:{}, manual:false };  // percorso sensoriale (solo locale)
state.weighDone= state.weighDone|| [];  // chiavi promemoria pesata archiviati
(function seedVitD(){
  try{ if(localStorage.getItem("nido_seed_vitd")) return; }catch(e){}
  if(!state.customTabs.some(t=>t.id==="vitd"))
    state.customTabs.push({id:"vitd", emoji:"💊", name:"Vitamina D", bg:"#ecd7ea", fg:"#874669", from:"2026-09-08"});
  try{ localStorage.setItem("nido_seed_vitd","1"); }catch(e){}
})();
(function migraVitDVecchie(){
  // le spunte fatte con la versione precedente stavano in state.vitD (solo date):
  // le trasformo in voci del foglio Vitamina D (ore 09:00), così non si perdono.
  if(!Array.isArray(state.vitD) || !state.vitD.length) return;
  state.events = state.events || [];
  state.vitD.forEach(d=>{
    if(typeof d!=="string") return;
    const giac = state.events.some(e=>e.type==="custom"&&e.catId==="vitd"&&dayKey(e.at)===d);
    if(giac) return;
    const at = new Date(d+"T09:00").getTime();
    if(!isNaN(at)) state.events.push({id:uid(), type:"custom", catId:"vitd", at:at, note:"4 gocce"});
  });
  state.events.sort((a,b)=>b.at-a.at);
  state.vitD=[];
  try{ save(); }catch(e){}
})();
(function dedupVitD(){
  // se esiste la scheda ufficiale 'vitd', rimuovo eventuali "Vitamina D" duplicate VUOTE
  const ct = state.customTabs||[];
  if(!ct.some(t=>t.id==="vitd")) return;
  const prima = ct.length;
  state.customTabs = ct.filter(t=>{
    if(t.id==="vitd") return true;
    if(!/vitamin/i.test(t.name||"")) return true;
    return (state.events||[]).some(e=>e.type==="custom"&&e.catId===t.id);   // tengo solo se ha voci
  });
  if(state.customTabs.length!==prima){ if(state.bebeTab && !state.customTabs.some(t=>("c_"+t.id)===state.bebeTab) && state.bebeTab.indexOf("c_")===0) state.bebeTab=null; try{ save(); }catch(e){} }
})();

let activeMacro = "bebe", editMode = false, taskWho = "tutti";

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1700); }

/* ============ Date ============ */
const dayKey = (ms)=>{ const d=new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayShort=(ms)=>{ const d=new Date(ms); const t=dayKey(Date.now());
  if(dayKey(ms)===t) return "oggi";
  return d.getDate()+"/"+(d.getMonth()+1); };
const hhmm   = (ms)=>{ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function dayLabel(key){
  const t=dayKey(Date.now()), y=dayKey(Date.now()-86400000);
  if(key===t) return "Oggi";
  if(key===y) return "Ieri";
  const [Y,M,D]=key.split("-");
  return new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"numeric",month:"long"}).format(new Date(+Y,+M-1,+D));
}
function sinceLabel(ms){
  const m=Math.round((Date.now()-ms)/60000);
  if(m<1) return "adesso";
  if(m<60) return m+" min fa";
  const h=Math.floor(m/60);
  return h+"h "+(m%60?(m%60)+"m ":"")+"fa";
}

/* ============ Macro ============ */
const MACROS=[{id:"bebe",label:"👶 Bebè"},{id:"fare",label:"✅ Da fare"},{id:"liste",label:"🛒 Liste"},{id:"percorso",label:"🌱 Percorso"}];
function buildMacro(){
  const el=document.getElementById("macro"); el.innerHTML="";
  MACROS.forEach(m=>{
    const b=document.createElement("button");
    b.className = m.id===activeMacro ? "active" : "";
    b.textContent=m.label;
    b.onclick=()=>{ activeMacro=m.id; editMode=false; buildMacro(); render(); };
    el.appendChild(b);
  });
}

/* ============ BEBÈ ============ */
const KINDS={ pipi:{e:"💧",t:"Pipì"}, pupu:{e:"💩",t:"Pupù"}, both:{e:"💧💩",t:"Pipì e pupù"} };

/* ---- Foglio unico per registrare un evento: sempre con data e ora modificabili ---- */
let draft=null;
function nowParts(){
  const d=new Date();
  return { date: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
           time: String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") };
}
function openEvent(type, id, catId){
  const n=nowParts();
  const e = id ? state.events.find(x=>x.id===id) : null;
  if(e){
    const d=new Date(e.at);
    draft={ id:e.id, type:e.type, catId:e.catId||null, kind:e.kind||"pipi", mode:e.mode||"seno", side:e.side||"sx",
            amount:e.amount||null, stato:e.stato||null, min:e.min||"", ml:e.ml||"", note:e.note||"",
            date: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
            time: String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") };
  } else {
    draft={ type:type, catId:catId||null, kind:"pipi", mode:"seno", side:"sx", date:n.date, time:n.time,
            note:(catId==="vitd"?"4 gocce":"") };
  }
  renderSheetEvent();
  document.getElementById("scrim").classList.add("on");
}
function closeSheet(){ document.getElementById("scrim").classList.remove("on"); draft=null; }

function renderSheetEvent(){
  const f=draft, s=document.getElementById("sheet");
  const cTab = f.type==="custom" ? ((state.customTabs||[]).find(t=>t.id===f.catId)||{name:"Scheda"}) : null;
  const titolo = (f.id?"Modifica ":"") + (f.type==="diaper" ? "cambio" : f.type==="feed" ? "poppata" : f.type==="cord" ? "medicazione" : f.type==="custom" ? (cTab.name||"voce").toLowerCase() : "vomito");
  const hint   = f.type==="diaper" ? "Cosa ha fatto" : f.type==="feed" ? "Come ha mangiato" : f.type==="cord" ? "Cordone ombelicale" : f.type==="custom" ? "Quando è stato" : "Quando è successo";

  let campi="";
  if(f.type==="diaper"){
    campi = '<div class="lbl">Tipo</div><div class="opts" id="dkind">'
      + '<button data-k="pipi" class="'+(f.kind==="pipi"?"on":"")+'">💧 Pipì</button>'
      + '<button data-k="pupu" class="'+(f.kind==="pupu"?"on":"")+'">💩 Pupù</button>'
      + '<button data-k="both" class="'+(f.kind==="both"?"on":"")+'">Entrambi</button></div>';
  } else if(f.type==="feed"){
    campi = '<div class="lbl">Modo</div><div class="opts" id="fmode">'
      + '<button data-m="seno" class="'+(f.mode==="seno"?"on":"")+'">🤱 Seno</button>'
      + '<button data-m="biberon" class="'+(f.mode==="biberon"?"on":"")+'">🍼 Biberon</button>'
      + '<button data-m="solido" class="'+(f.mode==="solido"?"on":"")+'">🥄 Solido</button></div>'
      + (f.mode==="seno"
          ? '<div class="lbl">Lato</div><div class="opts" id="fside">'
            + '<button data-s="sx" class="'+(f.side==="sx"?"on":"")+'">Sinistro</button>'
            + '<button data-s="dx" class="'+(f.side==="dx"?"on":"")+'">Destro</button>'
            + '<button data-s="due" class="'+(f.side==="due"?"on":"")+'">Entrambi</button></div>'
            + '<div class="lbl">Durata</div><div class="fld"><input id="fmin" type="number" inputmode="numeric" placeholder="minuti" value="'+(f.min||"")+'"><span class="u">min</span></div>'
          : f.mode==="biberon"
          ? '<div class="lbl">Quantità</div><div class="fld"><input id="fml" type="number" inputmode="numeric" placeholder="quanti ml" value="'+(f.ml||"")+'"><span class="u">ml</span></div>'
          : '<div class="lbl">Cosa</div><div class="fld"><input id="fcosa" type="text" placeholder="es. pappa di verdure" value="'+esc(f.note||"")+'"></div>');
  } else if(f.type==="cord"){
    campi = '<div class="lbl">Come si presenta</div><div class="opts" id="cst">'
      + '<button data-c="asciutto" class="'+(f.stato==="asciutto"?"on":"")+'">Asciutto</button>'
      + '<button data-c="umido" class="'+(f.stato==="umido"?"on":"")+'">Umido</button>'
      + '<button data-c="arrossato" class="'+(f.stato==="arrossato"?"on":"")+'">Arrossato</button></div>'
      + '<div class="opts" style="margin-top:8px" id="cst2">'
      + '<button data-c="caduto" class="'+(f.stato==="caduto"?"on":"")+'">🎉 È caduto</button></div>';
  } else if(f.type==="custom"){
    campi = "";
  } else {
    campi = '<div class="lbl">Quanto</div><div class="opts" id="vamt">'
      + '<button data-v="poco" class="'+(f.amount==="poco"?"on":"")+'">Poco</button>'
      + '<button data-v="medio" class="'+(f.amount==="medio"?"on":"")+'">Medio</button>'
      + '<button data-v="tanto" class="'+(f.amount==="tanto"?"on":"")+'">Tanto</button></div>';
  }

  s.innerHTML = '<h3>'+titolo+'</h3><div class="hint">'+hint+'</div>'
    + campi
    + '<div class="lbl">Giorno e ora</div>'
    + '<div class="opts"><div class="fld" style="flex:1.4"><input id="edate" type="date" value="'+f.date+'"></div>'
    + '<div class="fld" style="flex:1"><input id="etime" type="time" value="'+f.time+'"></div></div>'
    + '<div class="lbl">Nota</div><div class="fld"><input id="enote" type="text" placeholder="facoltativa" value="'+esc(f.type==="feed"?"":(f.note||""))+'"></div>'
    + '<button class="go" id="ego">'+(f.id?"Salva modifiche":"Registra")+'</button>'
    + '<button class="cancel" id="ecancel">Annulla</button>';

  const keep=()=>{ const d=s.querySelector("#edate"), t=s.querySelector("#etime"); if(d) draft.date=d.value; if(t) draft.time=t.value; };
  const kd=s.querySelector("#dkind");  if(kd) kd.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.kind=b.dataset.k; renderSheetEvent(); });
  const fm=s.querySelector("#fmode");  if(fm) fm.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.mode=b.dataset.m; renderSheetEvent(); });
  const fs=s.querySelector("#fside");  if(fs) fs.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.side=b.dataset.s; renderSheetEvent(); });
  const va=s.querySelector("#vamt");   if(va) va.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.amount=b.dataset.v; renderSheetEvent(); });
  ["#cst","#cst2"].forEach(sel=>{ const g=s.querySelector(sel); if(g) g.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.stato=b.dataset.c; renderSheetEvent(); }); });

  s.querySelector("#ego").onclick=()=>{
    keep();
    const at = draft.date ? new Date(draft.date+"T"+(draft.time||"12:00")).getTime() : Date.now();
    const note=(s.querySelector("#enote")||{}).value||"";
    const ev={ id:uid(), type:draft.type, at:at, note:note.trim() };
    if(draft.type==="diaper"){ ev.kind=draft.kind; }
    else if(draft.type==="feed"){
      const min=s.querySelector("#fmin"), ml=s.querySelector("#fml"), cosa=s.querySelector("#fcosa");
      ev.mode=draft.mode;
      ev.side=draft.mode==="seno"?draft.side:null;
      ev.min=min?(parseInt(min.value,10)||null):null;
      ev.ml=ml?(parseInt(ml.value,10)||null):null;
      if(cosa && cosa.value.trim()) ev.note=cosa.value.trim();
    } else if(draft.type==="cord"){ ev.stato=draft.stato||null; }
    else if(draft.type==="custom"){ ev.catId=draft.catId||null; }
    else { ev.amount=draft.amount||null; }
    const modifica = !!draft.id;
    if(modifica){ ev.id=draft.id; state.events=state.events.map(x=> x.id===draft.id ? ev : x); }
    else state.events.unshift(ev);
    state.events.sort((a,b)=>b.at-a.at);
    save(); closeSheet(); render();
    toast(modifica ? "Modifica salvata" : (ev.type==="diaper" ? "Cambio registrato" : ev.type==="feed" ? "Poppata registrata" : "Registrato"));
  };
  s.querySelector("#ecancel").onclick=closeSheet;
}
function feedText(e){
  if(e.mode==="seno")    return "Seno"+(e.side==="due"?" · entrambi":e.side==="dx"?" · destro":" · sinistro")+(e.min?" · "+e.min+" min":"");
  if(e.mode==="biberon") return "Biberon"+(e.ml?" · "+e.ml+" ml":"");
  return "Solido"+(e.note?" · "+e.note:"");
}
function delEvent(id){ tomb(id); state.events=state.events.filter(e=>e.id!==id); save(); render(); }

/* ============ Promemoria (in-app, condivisi) ============ */
const VITD_START="2026-09-08", VITD_END="2027-09-08";
function remindersHTML(){
  const today=dayKey(Date.now());
  let h='';
  if(today < VITD_START){
    h += '<div class="rem info">🔔 Vitamina D · promemoria ogni giorno dall\'8 settembre</div>';
  }
  const vitActive = today>=VITD_START && today<=VITD_END;
  if(vitActive){
    const done = (state.events||[]).some(e=>e.type==="custom"&&e.catId==="vitd"&&dayKey(e.at)===today);
    h += '<div class="rem'+(done?" done":"")+'">'
      + '<div class="rem-ic">💊</div>'
      + '<div class="rem-tx"><b>Vitamina D · 4 gocce</b><span>'+(done?"data oggi ✓":"da dare oggi a Gabriele")+'</span></div>'
      + (done ? '<button class="rem-btn ghost" data-vit="undo">Annulla</button>'
              : '<button class="rem-btn" data-vit="give">Fatto</button>')
      + '</div>';
  }
  const isSunday = new Date().getDay()===0;               // domenica
  const pesataOggi = (state.weights||[]).some(w=>dayKey(w.at)===today);
  const weighActive = isSunday && !(state.weighDone||[]).includes(today) && !pesataOggi;
  if(weighActive){
    h += '<div class="rem">'
      + '<div class="rem-ic">⚖️</div>'
      + '<div class="rem-tx"><b>Pesata di Gabri</b><span>promemoria della domenica</span></div>'
      + '<button class="rem-btn" data-weigh="now">Pesa</button>'
      + '<button class="rem-btn ghost" data-weigh="done">Fatto</button>'
      + '</div>';
  }
  return h;
}

      + '<span class="nm">'+(x.k==="weight" ? (w.length?fmtKg(w[0].kg)+" kg":"—") : (x.oggi?x.oggi+" oggi":"—"))+'</span>'
      + '</button>';

  h += '<button class="scheda addtab" id="addtabbtn"><span class="ic">＋</span><span class="ti">Aggiungi</span><span class="nm">scheda</span></button>';
  h += '</div>';

  if(!sel){
    h += '<div class="empty" style="padding:40px 20px"><span class="e">👶</span>'

  } else {
    const x=SCHEDE.find(z=>z.k===sel);
    h += '<div class="card cat" style="--catbg:'+x.bg+';--cat:'+x.fg+'"><div class="card-head" style="cursor:default">'

    if(!x.righe.length){
      h += '<div class="empty" style="padding:26px 16px"><span class="e">🌙</span>Ancora niente qui.<br>Tocca + per aggiungere.</div>';
    } else if(x.k==="weight"){
      x.righe.slice(0,40).forEach((it,i)=>{
        const prev=x.righe[i+1];
        const diff=prev ? (it.kg>=prev.kg?"+":"−")+Math.abs(Math.round((it.kg-prev.kg)*1000))+" g" : "prima pesata";
        const isSun = new Date(it.at).getDay()===0;   // domenica = 0
        let right;
        if(isSun){
          // incremento rispetto alla DOMENICA precedente (salta le pesate infrasettimanali)
          const dk=dayKey(it.at); let ps=null;
          for(let j=i+1;j<x.righe.length;j++){ const r=x.righe[j];

        else if(e.type==="custom") tit=(e.note?e.note:"Registrato");
        else                      tit=(KINDS[e.kind]||KINDS.pipi).e+" "+(KINDS[e.kind]||KINDS.pipi).t;

          + '<div class="time">'+hhmm(e.at)+'</div>'
          + '<button class="del" data-del="'+e.id+'">🗑</button></div>';
      });
    }
    h += '</div>';
  }

  v.innerHTML=h;

  v.querySelectorAll("[data-vit]").forEach(b=> tapSubito(b, (e)=>{ if(e&&e.stopPropagation) e.stopPropagation();
    const today=dayKey(Date.now());
    if(b.dataset.vit==="give"){
      if(!state.customTabs.some(t=>t.id==="vitd")) state.customTabs.push({id:"vitd", emoji:"💊", name:"Vitamina D", bg:"#ecd7ea", fg:"#874669", from:"2026-09-08"});
      state.events.unshift({id:uid(), type:"custom", catId:"vitd", at:Date.now(), note:"4 gocce"}); state.events.sort((a,b)=>b.at-a.at); state.bebeTab="c_vitd"; toast("Aggiunta al foglio Vitamina D ✓");
    }
    else { state.events.filter(x=> x.type==="custom"&&x.catId==="vitd"&&dayKey(x.at)===today).forEach(x=>tomb(x.id)); state.events = state.events.filter(x=> !(x.type==="custom"&&x.catId==="vitd"&&dayKey(x.at)===today)); }
    save(); render();
  }));
  v.querySelectorAll("[data-weigh]").forEach(b=> tapSubito(b, (e)=>{ if(e&&e.stopPropagation) e.stopPropagation();

  v.querySelectorAll("[data-tab]").forEach(b=> b.onclick=()=>{

    save(); render();

  enableTabDrag(v.querySelector(".schede"));

/* ---- Peso ---- */
function fmtKg(kg){ return (Math.round(kg*1000)/1000).toString().replace(".",","); }
function fmtDate(ms){ return new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"long",year:"numeric"}).format(new Date(ms)); }
function openWeight(id){
  const s=document.getElementById("sheet");
  const w0 = id ? state.weights.find(x=>x.id===id) : null;
  const base = w0 ? new Date(w0.at) : new Date();
  const iso=base.getFullYear()+"-"+String(base.getMonth()+1).padStart(2,"0")+"-"+String(base.getDate()).padStart(2,"0");
  s.innerHTML =
    '<h3>'+(w0?"Modifica pesata":"Pesata")+'</h3><div class="hint">Peso e giorno della misurazione</div>'
    + '<div class="lbl">Peso</div><div class="fld"><input id="wkg" type="number" inputmode="decimal" step="0.01" placeholder="es. 3,45" value="'+(w0?w0.kg:"")+'"><span class="u">kg</span></div>'
    + '<div class="lbl">Giorno</div><div class="fld"><input id="wdate" type="date" value="'+iso+'"></div>'
    + '<div class="lbl">Nota</div><div class="fld"><input id="wnote" type="text" placeholder="es. visita dal pediatra" value="'+esc(w0?(w0.note||""):"")+'"></div>'
    + '<button class="go" id="wgo">'+(w0?"Salva modifiche":"Registra pesata")+'</button>'
    + '<button class="cancel" id="wcancel">Annulla</button>';
  document.getElementById("scrim").classList.add("on");
  s.querySelector("#wgo").onclick=()=>{
    const kg=parseFloat(String(s.querySelector("#wkg").value).replace(",","."));
    if(!kg || kg<=0){ toast("Scrivi il peso"); return; }
    const d=s.querySelector("#wdate").value;
    const at=d ? new Date(d+"T12:00").getTime() : Date.now();
    const nota=s.querySelector("#wnote").value.trim();
    if(w0){ state.weights=state.weights.map(x=> x.id===w0.id ? {id:w0.id, kg:kg, at:at, note:nota} : x); }
    else state.weights.unshift({id:uid(), kg:kg, at:at, note:nota});
    state.weights.sort((a,b)=>b.at-a.at);
    save(); document.getElementById("scrim").classList.remove("on"); render(); toast(w0?"Modifica salvata":"Pesata registrata");
  };
  s.querySelector("#wcancel").onclick=()=>document.getElementById("scrim").classList.remove("on");
}

/* Il tasto deve rispondere al primo tocco anche con la tastiera aperta.
   NB: bloccare il pointerdown impedisce del tutto il click su iOS: qui si agisce
   al sollevamento del dito, con una guardia contro il doppio scatto. */
function tapSubito(btn, fn){
  if(!btn) return;
  let ultimo=0;
  const run=(e)=>{ const ora=Date.now(); if(ora-ultimo<400) return; ultimo=ora; fn(e); };
  btn.addEventListener("pointerup", run);
  btn.addEventListener("click", run);
}

/* ---- Trascina le schede tenendo premuto 1s (come le icone della Home) ---- */
let tabJustDragged=0;
function enableTabDrag(container){
  if(!container) return;
  container.querySelectorAll(".scheda[data-tab]").forEach(el=>{
    el.addEventListener("pointerdown", ev=>{
      if(ev.pointerType==="mouse" && ev.button!==0) return;
      const startX=ev.clientX, startY=ev.clientY;
      let started=false;
      const timer=setTimeout(()=>{ started=true; startDrag(el); }, 1000);
      const mv=e=>{ if(!started && (Math.abs(e.clientX-startX)>8 || Math.abs(e.clientY-startY)>8)) cleanup(); };
      const cleanup=()=>{ clearTimeout(timer); el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",cleanup); el.removeEventListener("pointercancel",cleanup); };
      el.addEventListener("pointermove",mv);
      el.addEventListener("pointerup",cleanup);
      el.addEventListener("pointercancel",cleanup);
    });
  });
  function startDrag(el){
    el.classList.add("dragging");
    if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
    const prevOverflow=container.style.overflowX; container.style.overflowX="hidden";
    const tabs=()=>[...container.querySelectorAll(".scheda[data-tab]")];
    const move=e=>{
      e.preventDefault();
      const x=e.clientX, y=e.clientY;
      for(const t of tabs()){
        if(t===el) continue;
        const r=t.getBoundingClientRect();
        if(x>r.left && x<r.right && y>r.top && y<r.bottom){
          if(x < r.left + r.width/2) container.insertBefore(el, t);
          else container.insertBefore(el, t.nextSibling);
          break;
        }
      }
    };
    const end=()=>{
      document.removeEventListener("pointermove",move,true);
      document.removeEventListener("pointerup",end,true);
      document.removeEventListener("pointercancel",end,true);
      container.style.overflowX=prevOverflow||"auto";
      el.classList.remove("dragging");
      state.tabOrder = tabs().map(t=>t.dataset.tab); save();
      tabJustDragged=Date.now();
      render();
    };
    document.addEventListener("pointermove",move,true);
    document.addEventListener("pointerup",end,true);
    document.addEventListener("pointercancel",end,true);
  }
}

function currentTabList(){
  const today=dayKey(Date.now());

    {k:"feed",emoji:"🍼",name:"Poppata"},

function moveTab(k, dir){
  const list=currentTabList().map(t=>t.k);
  const i=list.indexOf(k), j=i+dir;

  const tmp=list[i]; list[i]=list[j]; list[j]=tmp;
  state.tabOrder=list; save();
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* Ridisegnare la schermata mentre si scrive cancellava il testo appena digitato
   (succedeva a ogni aggiornamento della sincronizzazione): qui il contenuto dei
   campi, il fuoco e la posizione del cursore vengono conservati. */
function conservaCampi(fn){
  const att=document.activeElement;
  const chiave=(el)=> el.id ? "#"+el.id : (el.dataset && el.dataset.inew ? '[data-inew="'+el.dataset.inew+'"]' : null);
  const salvati=[...document.querySelectorAll("#view input")].map(el=>({
    sel:chiave(el), val:el.value,
    attivo: el===att, start:el.selectionStart, end:el.selectionEnd
  })).filter(x=>x.sel);
  fn();
  salvati.forEach(x=>{
    const el=document.querySelector(x.sel);
    if(!el) return;
    if(x.val && !el.value) el.value=x.val;
    if(x.attivo){
      el.focus();
      try{ if(x.start!=null) el.setSelectionRange(x.start,x.end); }catch(e){}
    }
  });
}

function etaTesto(){
  const g=Math.floor((Date.now()-NASCITA.ms)/86400000);
  if(g<0) return "";
  if(g===0) return "oggi";
  if(g<14) return g+(g===1?" giorno":" giorni");
  if(g<70){ const w=Math.floor(g/7); return w+(w===1?" settimana":" settimane"); }
  const m=Math.floor(g/30.44); return m+(m===1?" mese":" mesi");
}

  const a=document.getElementById("age");

function pcPct(i){ const s=PC_STAGES[i], p=pcS(); const d=s.todo.filter((_,j)=>p.done[s.id+":"+j]).length; return Math.round(d/s.todo.length*100); }

}

  out.customTabs = byId(server.customTabs, local.customTabs);
  out.docs = byId(server.docs, local.docs).sort((a,b)=>b.at-a.at);   // metadati documenti (file su Storage)
  out.numbers = byId(server.numbers, local.numbers).sort((a,b)=>b.at-a.at);   // numeri utili
  out.weighDone = uniq(server.weighDone, local.weighDone);
  out.tabOrder = (server.tabOrder&&server.tabOrder.length)?server.tabOrder:(local.tabOrder||[]);
  const lm={};
  [...(server.lists||[]), ...(local.lists||[])].forEach(l=>{
    if(!l||!l.id||del[l.id]) return;                             // lista cancellata → salto
    if(!lm[l.id]) lm[l.id]={id:l.id, emoji:l.emoji, name:l.name, items:(l.items||[]).filter(i=>!gone(i))};
    else{
      const seen=new Set(lm[l.id].items.map(i=>i.id));
      (l.items||[]).forEach(i=>{ if(!gone(i) && !seen.has(i.id)){ lm[l.id].items.push(i); seen.add(i.id); } });
    }
  });
  out.lists=Object.values(lm);
  return out;
}
async function initSync(){
  try{
    setConn("wait","Connessione…");
    const appMod = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js");
    FB           = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js");
    const app = appMod.initializeApp(FB_CONFIG);
    fdb = FB.getFirestore(app);
    fdoc = FB.doc(fdb, ROOM_COL, ROOM_DOC);
    fbReady = true;
    // --- Notifiche push (FCM): registra il token del telefono nel documento condiviso ---
    try{
      const M = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js");
      if(await M.isSupported()){
        const messaging = M.getMessaging(app);
        registerPush = async (silent)=>{
          if(!("Notification" in window)) return {ok:false};
          let perm = Notification.permission;
          if(perm!=="granted"){ if(silent) return {ok:false}; perm = await Notification.requestPermission(); if(perm!=="granted") return {ok:false}; }
          try{
            const reg = await navigator.serviceWorker.ready;
            const token = await M.getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
            if(!token) return {ok:false};
            const plat = (navigator.standalone || (matchMedia && matchMedia("(display-mode: standalone)").matches)) ? "home" : "browser";
            await FB.setDoc(fdoc, { pushTokens: { [token]: { ua: navigator.userAgent.slice(0,160), platform:plat, updatedAt: Date.now() } } }, { merge:true });
            return {ok:true};
          }catch(e){ console.warn("push token", e); return {ok:false}; }
        };
        if("Notification" in window && Notification.permission==="granted") registerPush(true);
      }
    }catch(e){ console.warn("messaging non attivo", e); }
    FB.onSnapshot(fdoc, {includeMetadataChanges:true},
      (snap)=>{
        if(snap.metadata.fromCache){ setConn("wait","Offline · solo questo telefono"); return; }
        setConn("on","Sincronizzato ✓");
        const data = snap.exists() ? snap.data() : null;
        if(!data){ cloudPush(); }
        else {
          // FONDO SEMPRE locale + server (union per id + tombstone). Applico anche
          // mentre sto scrivendo: la fusione tiene le mie modifiche in corso, quindi
          // gli aggiornamenti dell'altro telefono compaiono SUBITO (niente più attesa).
          const m = mergeUnion(state, data);
          SYNC_KEYS.forEach(k=> state[k]=m[k]);
          try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
          // Ripubblico solo se ho aggiunte/cancellazioni che il server non ha ancora
          // (propaga anche le cancellazioni). Basato su insiemi → converge, niente loop.
          if(needsPush(m, data)) scheduleCloudPush();
        }
        localStorage.setItem(SYNC_INIT,"1");
        conservaCampi(render);   // non cancellare quello che si sta scrivendo
      },
      (err)=>{ setConn("off","Sync non disponibile"); console.warn("Sync:", err); }
    );
  }catch(e){ setConn("off","Sync non disponibile"); console.warn("Sync non attivo:", e); }
}

const CORD_LABEL={asciutto:"asciutto", umido:"umido", arrossato:"arrossato", caduto:"caduto 🎉"};
function eventoTesto(e){
  if(e.type==="feed")  return "🍼 Poppata · "+feedText(e)+(e.mode!=="solido"&&e.note?" · "+e.note:"");
  if(e.type==="diaper")return "🧷 Cambio · "+((KINDS[e.kind]||KINDS.pipi).t)+(e.note?" · "+e.note:"");
  if(e.type==="vomit") return "🤢 Vomito"+(e.amount?" · "+e.amount:"")+(e.note?" · "+e.note:"");
  if(e.type==="cord")  return "🩹 Cordone · "+((CORD_LABEL[e.stato]||e.stato||"medicazione"))+(e.note?" · "+e.note:"");
  return "•";
}
function buildReport(period){
  const now=Date.now();
  const soglia = period==="oggi" ? now-0 : period==="7" ? now-7*86400000 : 0;
  const inPeriodo = (ms)=> period==="oggi" ? dayKey(ms)===dayKey(now) : (period==="7" ? ms>=soglia : true);

  let L=[];
  L.push("🍼 NIDO — Diario del bebè");
  L.push("Aggiornato al "+fmtDate(now)+" "+hhmm(now));
  L.push("");

  // --- eventi raggruppati PER CATEGORIA ---
  const ev=(state.events||[]).filter(e=>inPeriodo(e.at));
  const quandoLbl=(ms)=>{ const d=new Date(ms); const gg=dayLabel(dayKey(ms));
    return (gg==="Oggi"||gg==="Ieri"?gg:d.getDate()+"/"+(d.getMonth()+1))+" "+hhmm(ms); };
  const dettaglio=(e)=>{
    if(e.type==="feed")  return feedText(e)+(e.mode!=="solido"&&e.note?" · "+e.note:"");
    if(e.type==="diaper")return (KINDS[e.kind]||KINDS.pipi).t+(e.note?" · "+e.note:"");
    if(e.type==="vomit") return (e.amount||"")+(e.note?(e.amount?" · ":"")+e.note:"");
    if(e.type==="cord")  return (CORD_LABEL[e.stato]||e.stato||"medicazione")+(e.note?" · "+e.note:"");
    return "";
  };
  const CAT=[
    {t:"feed",  titolo:"🍼 POPPATE"},
    {t:"diaper",titolo:"🧷 CAMBI"},
    {t:"vomit", titolo:"🤢 VOMITO"},
    {t:"cord",  titolo:"🩹 CORDONE"}
  ];
  let qualcosa=false;
  CAT.forEach(c=>{
    const list=ev.filter(e=>e.type===c.t).slice().sort((a,b)=>b.at-a.at);
    if(!list.length) return;
    qualcosa=true;
    L.push(c.titolo+"  ("+list.length+")");
    list.forEach(e=>{ const d=dettaglio(e); L.push("   "+quandoLbl(e.at)+(d?"  ·  "+d:"")); });
    L.push("");
  });
  (state.customTabs||[]).forEach(t=>{
    const list=ev.filter(e=>e.type==="custom"&&e.catId===t.id).slice().sort((a,b)=>b.at-a.at);
    if(!list.length) return;
    qualcosa=true;
    L.push((t.emoji||"⭐")+" "+(t.name||"Scheda").toUpperCase()+"  ("+list.length+")");
    list.forEach(e=>{ L.push("   "+quandoLbl(e.at)+(e.note?"  ·  "+e.note:"")); });
    L.push("");
  });

  // --- peso ---
  const w=(state.weights||[]).filter(x=>inPeriodo(x.at)).slice().sort((a,b)=>b.at-a.at);
  if(w.length){
    L.push("⚖️ PESO  ("+w.length+")"); qualcosa=true;
    w.forEach((x,i)=>{ const prev=w[i+1];
      const diff=prev ? " ("+(x.kg>=prev.kg?"+":"−")+Math.abs(Math.round((x.kg-prev.kg)*1000))+" g)" : "";
      L.push("   "+fmtDate(x.at)+"  "+fmtKg(x.kg)+" kg"+diff+(x.note?" · "+x.note:"")); });
    L.push("");
  }

  if(!qualcosa){ L.push("— Nessun evento del bebè nel periodo —"); L.push(""); }

  // --- da fare ---
  const t=(state.tasks||[]);
  if(t.length){
    L.push("✅ DA FARE");
    t.filter(x=>!x.done).forEach(x=> L.push("   ☐ "+x.text+" ("+(WHO[x.who]||x.who)+")"));
    t.filter(x=>x.done).forEach(x=> L.push("   ☑ "+x.text+" ("+(WHO[x.who]||x.who)+")"));
    L.push("");
  }

  // --- liste ---
  const listeConVoci=(state.lists||[]).filter(l=>(l.items||[]).length);
  if(listeConVoci.length){
    L.push("🛒 LISTE");
    listeConVoci.forEach(l=>{
      L.push("   "+l.emoji+" "+l.name);
      (l.items||[]).forEach(i=> L.push("      "+(i.done?"☑":"☐")+" "+i.text));
    });
    L.push("");
  }

  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}

/* ============ Grafico andamento ============ */
const CH_SERIES=[
  {k:"feed",   nome:"Poppate", col:"#2f7247", axis:"count"},
  {k:"diaper", nome:"Cambi",   col:"#c39a1f", axis:"count"},
  {k:"vomit",  nome:"Vomito",  col:"#8a5a2c", axis:"count"},
  {k:"cord",   nome:"Cordone", col:"#574685", axis:"count"},
  {k:"weight", nome:"Peso",    col:"#3c6a8e", axis:"kg"}
];
let chartVisible={feed:true, diaper:true, vomit:false, cord:false, weight:true};
let chartPeriod="14";

function chDays(period){
  const now=Date.now(); const oggi=dayKey(now);
  // ultimo giorno = oggi o l'ultima data con dati
  let all=[]; (state.events||[]).forEach(e=>all.push(e.at)); (state.weights||[]).forEach(w=>all.push(w.at));
  const maxMs = all.length ? Math.max(now, Math.max.apply(null,all)) : now;
  let n = period==="7"?7 : period==="14"?14 : period==="30"?30 : 0;
  let minMs;
  if(n){ minMs = maxMs - (n-1)*86400000; }
  else { minMs = all.length ? Math.min.apply(null,all) : maxMs; }   // "tutto"
  const days=[]; let d=new Date(minMs); d.setHours(12,0,0,0);
  const end=new Date(maxMs); end.setHours(12,0,0,0);
  while(d.getTime()<=end.getTime()){ days.push(dayKey(d.getTime())); d=new Date(d.getTime()+86400000); }
  if(!days.length) days.push(oggi);
  return days;
}
function chDataFor(k, days){
  if(k==="weight"){
    // punti reali (kg) sui giorni in cui c'è una pesata; media se più d'una
    const byDay={};
    (state.weights||[]).forEach(w=>{ const key=dayKey(w.at); (byDay[key]=byDay[key]||[]).push(w.kg); });
    return days.map(key=> byDay[key] ? {v: byDay[key].reduce((a,b)=>a+b,0)/byDay[key].length} : null);
  }
  const byDay={};
  (state.events||[]).filter(e=>e.type===k).forEach(e=>{ const key=dayKey(e.at); byDay[key]=(byDay[key]||0)+1; });
  return days.map(key=> ({v: byDay[key]||0}) );
}
function buildChartSVG(){
  const days=chDays(chartPeriod);
  const n=days.length;
  const W=340, H=210, padL=26, padR=34, padT=14, padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const X=(i)=> padL + (n<=1?plotW/2:(i/(n-1))*plotW);

  // scala conteggi (serie count visibili)
  let maxCount=0;
  CH_SERIES.filter(s=>s.axis==="count"&&chartVisible[s.k]).forEach(s=>{
    chDataFor(s.k,days).forEach(p=>{ if(p&&p.v>maxCount) maxCount=p.v; });
  });
  maxCount=Math.max(maxCount, 3);
  const Yc=(v)=> padT + plotH - (v/maxCount)*plotH;

  // scala peso
  const wPts=chDataFor("weight",days).map((p,i)=>p?{i,v:p.v}:null).filter(Boolean);
  let wMin=Infinity, wMax=-Infinity; wPts.forEach(p=>{ wMin=Math.min(wMin,p.v); wMax=Math.max(wMax,p.v); });
  if(!isFinite(wMin)){ wMin=0; wMax=1; }
  if(wMin===wMax){ wMin-=0.2; wMax+=0.2; }
  const pad=(wMax-wMin)*0.15; wMin-=pad; wMax+=pad;
  const Yw=(v)=> padT + plotH - ((v-wMin)/(wMax-wMin))*plotH;

  let g='';
  // griglia orizzontale + asse conteggi
  const steps=Math.min(maxCount,4);
  for(let s=0;s<=steps;s++){ const val=Math.round(maxCount*s/steps); const y=Yc(val);
    g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef1ee" stroke-width="1"/>';
    g+='<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="8" fill="#9aa89d">'+val+'</text>';
  }
  // etichette date sull'asse x
  const step=Math.max(1, Math.ceil(n/6));
  days.forEach((key,i)=>{ if(i%step!==0 && i!==n-1) return;
    const d=new Date(key.split("-")[0], +key.split("-")[1]-1, +key.split("-")[2]);
    const lab=d.getDate()+"/"+(d.getMonth()+1);
    g+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="8" fill="#9aa89d">'+lab+'</text>';
  });
  // asse kg a destra, se il peso è visibile
  if(chartVisible.weight && wPts.length){
    for(let s=0;s<=2;s++){ const v=wMin+(wMax-wMin)*s/2; const y=Yw(v);
      g+='<text x="'+(W-padR+4)+'" y="'+(y+3)+'" text-anchor="start" font-size="8" fill="#3c6a8e">'+fmtKg(Math.round(v*100)/100)+'</text>';
    }
  }
  // linee delle serie
  CH_SERIES.forEach(sr=>{
    if(!chartVisible[sr.k]) return;
    const data=chDataFor(sr.k,days);
    const pts=[];
    data.forEach((p,i)=>{ if(p==null) return; const y= sr.axis==="kg"?Yw(p.v):Yc(p.v); pts.push([X(i),y,p.v]); });
    if(!pts.length) return;
    if(pts.length>1){
      g+='<polyline fill="none" stroke="'+sr.col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'
         + pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>';
    }
    pts.forEach(p=>{ g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(sr.axis==="kg"?3:2.6)+'" fill="'+sr.col+'"/>'; });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}
function openChart(){
  const s=document.getElementById("sheet");
  const draw=()=>{
    const nessuno=!Object.keys(chartVisible).some(k=>chartVisible[k]);
    s.innerHTML =
      '<h3>Andamento</h3><div class="hint">Tocca le categorie per mostrarle o nasconderle</div>'
      + '<div class="ch-legend" id="chleg">'
        + CH_SERIES.map(sr=>'<button class="ch-chip'+(chartVisible[sr.k]?" on":"")+'" data-k="'+sr.k+'" style="'
            +(chartVisible[sr.k]?"background:"+sr.col+";border-color:"+sr.col+";color:#fff":"color:"+sr.col)+'">'
            +'<span class="dot"></span>'+sr.nome+'</button>').join("")
      + '</div>'
      + '<div class="exp-seg" id="chseg">'
        + '<button data-p="7" class="'+(chartPeriod==="7"?"on":"")+'">7 g</button>'
        + '<button data-p="14" class="'+(chartPeriod==="14"?"on":"")+'">14 g</button>'
        + '<button data-p="30" class="'+(chartPeriod==="30"?"on":"")+'">30 g</button>'
        + '<button data-p="all" class="'+(chartPeriod==="all"?"on":"")+'">Tutto</button></div>'
      + (nessuno ? '<div class="ch-empty">Seleziona almeno una categoria qui sopra.</div>'
                 : '<div class="ch-wrap">'+buildChartSVG()+'</div>')
      + '<div class="hint" style="margin-top:10px">Poppate, cambi, vomito e cordone: numero al giorno. Peso: kg (scala a destra).</div>'
      + '<button class="cancel" id="chclose">Chiudi</button>';
    s.querySelectorAll("#chleg button").forEach(b=> tapSubito(b, ()=>{ chartVisible[b.dataset.k]=!chartVisible[b.dataset.k]; draw(); }));
    s.querySelectorAll("#chseg button").forEach(b=> b.onclick=()=>{ chartPeriod=b.dataset.p; draw(); });

  draw();
  document.getElementById("scrim").classList.add("on");
}

(function autoNotifNido(){

/* ============ Documenti (salvati sul telefono, IndexedDB) ============ */
let _docDB=null;
function docDB(){ return new Promise((res,rej)=>{ if(_docDB) return res(_docDB);
  const r=indexedDB.open("nido_docs",1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("files")) r.result.createObjectStore("files",{keyPath:"id"}); };
  r.onsuccess=()=>{ _docDB=r.result; res(_docDB); }; r.onerror=()=>rej(r.error); }); }
function docStore(mode){ return docDB().then(db=>db.transaction("files",mode).objectStore("files")); }
function docSaveLocal(id, file){ return docStore("readwrite").then(st=>new Promise((res,rej)=>{
  const rec={id:id, name:file.name||"documento", type:file.type||"", size:file.size||0, at:Date.now(), blob:file};
  const rq=st.put(rec); rq.onsuccess=()=>res(id); rq.onerror=()=>rej(rq.error); })); }
/* --- File condivisi: salvati a PEZZI in Firestore (collezione 'nido_files'), gratis (niente Storage/Blaze) --- */
const DOC_CHUNK = 700000;   // caratteri base64 per pezzo (< 1 MB, limite documento Firestore)
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const s=String(r.result||""); res(s.slice(s.indexOf(",")+1)); };
  r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
function b64ToBlob(b64, type){ const bin=atob(b64), len=bin.length, arr=new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], {type:type||"application/octet-stream"}); }
async function docUpload(id, file){ if(!fbReady||!fdb) return null;
  const b64=await blobToB64(file); const chunks=[];
  for(let i=0;i<b64.length;i+=DOC_CHUNK) chunks.push(b64.slice(i,i+DOC_CHUNK));
  for(let n=0;n<chunks.length;n++) await FB.setDoc(FB.doc(fdb,"nido_files",id+"__"+n), {b:chunks[n]});
  return chunks.length; }                               // ritorna il numero di pezzi
async function docDownload(id, nc, type){ if(!fbReady||!fdb||!nc) return null;
  let b64=""; for(let n=0;n<nc;n++){ const snap=await FB.getDoc(FB.doc(fdb,"nido_files",id+"__"+n));
    if(!snap.exists()) return null; b64+=(snap.data().b||""); }
  return b64ToBlob(b64, type); }
async function docRemoveRemote(id, nc){ if(!fbReady||!fdb||!nc) return;
  for(let n=0;n<nc;n++){ try{ await FB.deleteDoc(FB.doc(fdb,"nido_files",id+"__"+n)); }catch(e){} } }
function docListAll(){ return docStore("readonly").then(st=>new Promise((res,rej)=>{
  const rq=st.getAll(); rq.onsuccess=()=>res((rq.result||[]).sort((a,b)=>b.at-a.at)); rq.onerror=()=>rej(rq.error); })); }
function docGetOne(id){ return docStore("readonly").then(st=>new Promise((res,rej)=>{
  const rq=st.get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }
function docDelOne(id){ return docStore("readwrite").then(st=>new Promise((res,rej)=>{
  const rq=st.delete(id); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); })); }
function fmtBytes(n){ n=Number(n)||0; if(n<1024) return n+" B"; if(n<1048576) return Math.round(n/1024)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function docIcon(type){ type=type||""; if(type.indexOf("pdf")>-1) return "📄"; if(type.indexOf("image")===0) return "🖼️"; return "📎"; }

async function docMergedList(){
  let local=[]; try{ local=await docListAll(); }catch(e){}
  const localIds=new Set(local.map(d=>d.id));
  const rows=local.map(d=>({id:d.id,name:d.name,type:d.type,size:d.size,at:d.at,remote:false}));
  (state.docs||[]).forEach(d=>{ if(!localIds.has(d.id)) rows.push({id:d.id,name:d.name,type:d.type,size:d.size,at:d.at,remote:true,nc:d.nc}); });
  return rows.sort((a,b)=>b.at-a.at);
}
async function openDocs(){
  const s=document.getElementById("sheet");
  const list=await docMergedList();
  const hint = stoOk===true ? "Documenti condivisi tra i telefoni ✓ (es. orari del pediatra)"
             : stoOk===false ? "Solo su questo telefono. Per condividerli, attiva Storage in Firebase."
             : "Documenti importanti del bebè (es. orari del pediatra).";
  s.innerHTML='<h3>Documenti</h3><div class="hint">'+hint+'</div>'
    + (list.length ? list.map(d=>'<div class="doc-row" data-doc="'+d.id+'"><div class="di">'+docIcon(d.type)+'</div>'
        +'<div class="dn"><b>'+esc(d.name)+'</b><span>'+fmtBytes(d.size)+(d.remote?' · ☁️ da scaricare':'')+'</span></div>'
        +'<button class="dd" data-docdel="'+d.id+'">🗑</button></div>').join("")
      : '<div class="empty" style="padding:22px"><span class="e">📂</span>Ancora nessun documento.<br>Tocca qui sotto per caricarne uno.</div>')
    + '<button class="doc-add" id="docAddBtn">＋ Carica un documento</button>'
    + '<button class="cancel" id="docClose">Chiudi</button>';
  document.getElementById("scrim").classList.add("on");
  s.querySelector("#docAddBtn").onclick=()=>document.getElementById("docInput").click();
  s.querySelectorAll("[data-doc]").forEach(el=> el.onclick=(e)=>{ if(e.target.closest("[data-docdel]")) return; viewDoc(el.dataset.doc); });
  s.querySelectorAll("[data-docdel]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); const id=b.dataset.docdel;
    askConfirm("Vuoi eliminare questo documento?", ()=>docDelete(id)); });
  s.querySelector("#docClose").onclick=()=>document.getElementById("scrim").classList.remove("on");
}
async function docDelete(id){
  tomb(id);
  const meta=(state.docs||[]).find(d=>d.id===id);
  state.docs=(state.docs||[]).filter(d=>d.id!==id);
  try{ await docDelOne(id); }catch(e){}
  if(meta&&meta.nc) docRemoveRemote(id, meta.nc);
  save(); openDocs();
}
async function onDocPick(e){
  const f=e.target.files && e.target.files[0]; e.target.value="";
  if(!f) return;
  const id=uid();
  try{
    await docSaveLocal(id, f);                 // cache locale (apertura veloce/offline)
    let nc=null;
    if(fbReady){ try{ nc=await docUpload(id, f); setStoOk(true); }catch(err){ console.warn("upload doc", err); setStoOk(false); } }
    if(nc){ state.docs=state.docs||[]; state.docs.unshift({id, name:f.name||"documento", type:f.type||"", size:f.size||0, at:Date.now(), nc}); save();
            toast("Documento caricato e condiviso ✓"); }
    else { toast(stoOk===false ? "Caricato solo su questo telefono (condivisione non attiva)" : "Caricato (solo su questo telefono)"); }
    openDocs();
  }catch(err){ console.warn("doc save", err); toast("Non è stato possibile caricarlo"); }
}
let _pdfjsReady=null;
function loadPdfjs(){
  if(_pdfjsReady) return _pdfjsReady;
  _pdfjsReady=new Promise((res,rej)=>{
    if(window.pdfjsLib){ res(window.pdfjsLib); return; }
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){} res(window.pdfjsLib); };
    sc.onerror=()=>rej(new Error("pdfjs non caricato"));
    document.head.appendChild(sc);
  });
  return _pdfjsReady;
}
async function renderPdf(url, body){
  body.innerHTML='<div class="dv-msg">Carico il documento…</div>';
  try{
    const pdfjs=await loadPdfjs();
    const doc=await pdfjs.getDocument(url).promise;
    const wrap=document.createElement("div"); wrap.className="pdfwrap";
    body.innerHTML=""; body.appendChild(wrap);
    const width=(body.clientWidth||window.innerWidth)-16;
    const dpr=Math.min(window.devicePixelRatio||1, 2.5);
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p);
      const v1=page.getViewport({scale:1});
      const vp=page.getViewport({scale:(width/v1.width)*dpr});
      const cv=document.createElement("canvas");
      cv.width=vp.width; cv.height=vp.height;
      wrap.appendChild(cv);
      await page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
    }
  }catch(e){ console.warn("pdf", e); body.innerHTML='<div class="dv-msg">Non riesco a mostrare questo PDF.<br>Riprova con la connessione attiva.</div>'; }
}
async function viewDoc(id){
  let d=null; try{ d=await docGetOne(id); }catch(e){}
  let blob = d&&d.blob ? d.blob : null, type = d?d.type:"", name = d?d.name:"documento";
  const body=document.getElementById("dvBody"), dv=document.getElementById("docview");
  if(!blob){
    // non in cache locale: lo scarico da Storage con i metadati condivisi
    const meta=(state.docs||[]).find(x=>x.id===id);
    if(!meta||!meta.nc){ toast("Documento non disponibile su questo telefono"); return; }
    type=meta.type; name=meta.name;
    dv.hidden=false; document.getElementById("scrim").classList.remove("on");
    body.innerHTML='<div class="dv-msg">Scarico il documento…</div>';
    try{ blob=await docDownload(id, meta.nc, meta.type); }catch(err){ console.warn("download doc", err); }
    if(!blob){ body.innerHTML='<div class="dv-msg">Non riesco a scaricare il documento.<br>Riprova con la connessione attiva.</div>'; return; }
    try{ await docSaveLocal(id, new File([blob], name, {type})); }catch(e){}   // metto in cache per le prossime volte
  }
  const url=URL.createObjectURL(blob), t=type||"";
  dv._url=url; dv.hidden=false;
  document.getElementById("scrim").classList.remove("on");
  if(t.indexOf("image")===0){ body.innerHTML='<div class="dv-center"><img alt="'+esc(name)+'"></div>'; body.querySelector("img").src=url; }
  else if(t.indexOf("pdf")>-1){ renderPdf(url, body); }
  else { body.innerHTML='<div class="dv-msg">Anteprima non disponibile per questo tipo di file.</div>'; }
}
function closeDocView(){ const dv=document.getElementById("docview"); dv.hidden=true;
  if(dv._url){ try{ URL.revokeObjectURL(dv._url); }catch(e){} dv._url=null; }
  document.getElementById("dvBody").innerHTML=""; openDocs(); }

/* ============ Numeri utili (condivisi tra i telefoni) ============ */
const telHref = t => "tel:"+String(t||"").replace(/[^\d+]/g,"");
function openNums(){
  const s=document.getElementById("sheet");
  const list=(state.numbers||[]).slice().sort((a,b)=>b.at-a.at);
  s.innerHTML='<h3>Numeri utili</h3><div class="hint">Pediatra, guardia medica, farmacia… tocca un numero per chiamare</div>'
    + (list.length ? list.map(n=>'<div class="doc-row"><div class="di">☎️</div>'
        +'<div class="dn tocca" data-numcall="'+n.id+'"><b>'+esc(n.name||"Numero")+'</b><span>'+esc(n.tel||"")+'</span></div>'
        +'<button class="dd" data-numedit="'+n.id+'" aria-label="Modifica">✏️</button>'
        +'<button class="dd" data-numdel="'+n.id+'" aria-label="Elimina">🗑</button></div>').join("")
      : '<div class="empty" style="padding:22px"><span class="e">📇</span>Ancora nessun numero.<br>Tocca qui sotto per aggiungerne uno.</div>')
    + '<button class="doc-add" id="numAddBtn">＋ Aggiungi numero</button>'
    + '<button class="cancel" id="numClose">Chiudi</button>';
  document.getElementById("scrim").classList.add("on");
  s.querySelector("#numAddBtn").onclick=()=>openNumEdit();
  s.querySelectorAll("[data-numcall]").forEach(el=> el.onclick=()=>{ const n=(state.numbers||[]).find(x=>x.id===el.dataset.numcall); if(n&&n.tel) window.location.href=telHref(n.tel); });
  s.querySelectorAll("[data-numedit]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); openNumEdit(b.dataset.numedit); });
  s.querySelectorAll("[data-numdel]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); const id=b.dataset.numdel;
    askConfirm("Vuoi eliminare questo numero?", ()=>numDelete(id)); });
  s.querySelector("#numClose").onclick=()=>document.getElementById("scrim").classList.remove("on");
}
function openNumEdit(id){
  const s=document.getElementById("sheet");
  const n0 = id ? (state.numbers||[]).find(x=>x.id===id) : null;
  s.innerHTML =
    '<h3>'+(n0?"Modifica numero":"Nuovo numero")+'</h3><div class="hint">Descrizione e numero di telefono</div>'
    + '<div class="lbl">Descrizione</div><div class="fld"><input id="nnome" type="text" placeholder="es. Pediatra Dr. Rossi" value="'+esc(n0?(n0.name||""):"")+'"></div>'
    + '<div class="lbl">Numero</div><div class="fld"><input id="ntel" type="tel" inputmode="tel" placeholder="es. 030 123456" value="'+esc(n0?(n0.tel||""):"")+'"></div>'
    + '<button class="go" id="ngo">'+(n0?"Salva modifiche":"Aggiungi")+'</button>'
    + '<button class="cancel" id="ncancel">Annulla</button>';
  document.getElementById("scrim").classList.add("on");
  s.querySelector("#ngo").onclick=()=>{
    const name=s.querySelector("#nnome").value.trim();
    const tel=s.querySelector("#ntel").value.trim();
    if(!tel){ toast("Scrivi il numero"); return; }
    if(n0){ state.numbers=(state.numbers||[]).map(x=> x.id===n0.id ? {id:n0.id, name:name, tel:tel, at:n0.at||Date.now()} : x); }
    else { state.numbers=state.numbers||[]; state.numbers.unshift({id:uid(), name:name, tel:tel, at:Date.now()}); }
    save(); openNums(); toast(n0?"Numero salvato":"Numero aggiunto");
  };
  s.querySelector("#ncancel").onclick=()=>openNums();
}
function numDelete(id){
  tomb(id);
  state.numbers=(state.numbers||[]).filter(x=>x.id!==id);
  save(); openNums();
}

(function(){ const el=document.getElementById("appver"); if(!el||!("caches" in window)) return;
  const show=()=>caches.keys().then(ks=>{ const v=(ks.find(k=>/^nido-c2-/.test(k))||"").replace("nido-c2-",""); if(v) el.textContent=v; });
  show(); if(navigator.serviceWorker){ navigator.serviceWorker.addEventListener("controllerchange", show); }
})();
