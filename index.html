<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nido · Bebè</title>
<meta name="theme-color" content="#eef7ef" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Nido" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#eef7ef; --bg2:#e0f0e3; --surface:#ffffff;
    --ink:#26342a; --ink-soft:#6a7d70; --line:#dceadf;
    --sage:#4fa269; --sage-bg:#e6f4ea; --sage-soft:#a3d5b0;
    --butter:#f4cd78; --coral:#ef9a85; --sky:#8ec5e8;
    --shadow-soft:0 6px 20px rgba(38,52,42,.07);
    --r:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:120px}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  /* intestazione */
  header{padding:calc(env(safe-area-inset-top) + 22px) 0 4px;text-align:center}
  .logo{width:74px;height:74px;margin:0 auto 10px;border-radius:24px;background:var(--sage-bg);
    display:grid;place-items:center;font-size:36px;box-shadow:var(--shadow-soft)}
  h1{font-family:'Quicksand';font-weight:700;font-size:30px;letter-spacing:-.4px}
  .sub{color:var(--ink-soft);font-size:14.5px;margin-top:2px}
  .sync{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border-radius:99px;
    padding:6px 14px;margin-top:12px;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow-soft)}
  .sync .d{width:9px;height:9px;border-radius:50%;background:var(--butter)}
  .sync .d.on{background:var(--sage)} .sync .d.off{background:var(--coral)}

  /* macro */
  .macro{display:flex;gap:8px;background:var(--surface);border-radius:var(--r);padding:6px;
    margin:20px 0 6px;box-shadow:var(--shadow-soft)}
  .macro button{flex:1;border:none;background:none;font-family:'Quicksand';font-weight:600;font-size:14.5px;
    color:var(--ink-soft);padding:11px 6px;border-radius:16px;cursor:pointer;transition:.18s}
  .macro button.active{background:var(--sage);color:#fff}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;margin:0 -18px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:999px;cursor:pointer;transition:.18s}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip-x{margin-left:7px;font-size:12px;opacity:.75}
  .chip-add,.chip-edit{border-style:dashed}
  .chip-edit.active{background:var(--sage);border-color:var(--sage)}

  /* card generica */
  .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-soft);margin:14px 0;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer}
  .card-emoji{font-size:23px;width:42px;height:42px;display:grid;place-items:center;background:var(--sage-bg);border-radius:14px;flex:none}
  .card-title{flex:1;min-width:0}
  .card-title h2{font-family:'Quicksand';font-weight:600;font-size:17px;line-height:1.2}
  .card-title .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .card-count{font-family:'Quicksand';font-weight:600;font-size:13px;color:var(--ink-soft);flex:none}
  .card-del{border:none;background:none;font-size:18px;padding:4px 6px;cursor:pointer;flex:none}
  /* linguette da schedario: si sovrappongono leggermente, come le cartelline */
  .schede{display:flex;align-items:flex-end;margin:16px 0 0;padding-left:2px}
  .scheda{flex:1;min-width:0;background:var(--catbg,var(--bg2));border:1px solid rgba(38,52,42,.07);border-bottom:none;
    border-radius:13px 13px 0 0;padding:8px 4px 9px 12px;margin-left:-11px;
    display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;
    box-shadow:2px -2px 6px rgba(38,52,42,.06);transition:.16s;position:relative}
  .scheda:first-child{margin-left:0;padding-left:6px}
  .scheda:nth-child(1){z-index:4} .scheda:nth-child(2){z-index:3}
  .scheda:nth-child(3){z-index:2} .scheda:nth-child(4){z-index:1}
  .scheda .ic{font-size:19px;line-height:1.15}
  .scheda .ti{font-family:'Quicksand';font-weight:700;font-size:11px;color:var(--ink-soft);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .scheda .nm{font-size:9px;color:var(--ink-soft);opacity:.75;line-height:1.2;white-space:nowrap}
  .scheda .ti{color:var(--cat,var(--ink-soft))}
  .scheda:not(.on){opacity:.7}
  /* aperta: stessa tinta dell'etichetta, che prosegue nel foglio sotto */
  .scheda.on{background:var(--catbg);border-color:var(--cat);z-index:20;
    padding-top:12px;margin-bottom:-1px;box-shadow:0 -3px 9px rgba(38,52,42,.07)}
  .scheda.on .ti{color:var(--cat)}
  .scheda.on .nm{opacity:1;color:var(--cat)}
  .card.cat{background:var(--catbg)}
  .card.cat .card-emoji{background:#fff}
  .card.cat .ev{border-bottom-color:rgba(38,52,42,.08)}
  .card.cat .ev .dot{background:#fff}
  .card.cat .sez-add{background:var(--cat)}
  /* il foglio sotto le linguette */
  .schede + .card{margin-top:0;border-top-left-radius:4px}
  .sez-add{border:none;background:var(--sage);color:#fff;width:34px;height:34px;border-radius:12px;
    font-size:22px;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center}
  .sez-add:active{transform:scale(.92)}
  .chev{color:var(--ink-soft);font-size:19px;transition:transform .2s;flex:none;width:18px;text-align:center}
  .chev.up{transform:rotate(180deg)}
  .ev .dot{font-family:'Quicksand';font-weight:700;font-size:12px;color:var(--ink-soft)}

  /* ---- BEBÈ: registro ---- */
  .bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .bigbtn{border:none;border-radius:20px;padding:18px 12px;cursor:pointer;color:#fff;
    font-family:'Quicksand';font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:var(--shadow-soft);transition:transform .12s}
  .bigbtn:active{transform:scale(.97)}
  .bigbtn .ico{font-size:26px}
  .bigbtn.pipi{background:var(--butter);color:#5c4611}
  .bigbtn.pupu{background:#c9a227;color:#fff}
  .bigbtn.both{background:var(--coral)}
  .bigbtn.feed{background:var(--sage)}
  .bigbtn.vomit{background:#b98a5e}
  .bigbtn.weight{background:#7fa8c9}
  .today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{background:var(--surface);border-radius:18px;padding:13px 10px;text-align:center;box-shadow:var(--shadow-soft)}
  .stat b{display:block;font-family:'Quicksand';font-weight:700;font-size:24px;line-height:1.1}
  .stat span{font-size:11.5px;color:var(--ink-soft)}
  .ev{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--sage-bg)}
  .ev .txt{flex:1;min-width:0}
  .ev .txt b{font-family:'Quicksand';font-weight:600;font-size:15px}
  .ev .txt span{display:block;font-size:12.5px;color:var(--ink-soft)}
  .ev .time{font-family:'Quicksand';font-weight:600;font-size:14px;color:var(--ink-soft);flex:none}
  .ev .del{border:none;background:none;font-size:16px;padding:4px;cursor:pointer;opacity:.5}
  .daylabel{font-family:'Quicksand';font-weight:700;font-size:13px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.6px;margin:22px 2px 8px}

  /* ---- compiti / liste ---- */
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .cb{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--sage-soft);background:var(--surface);
    flex:none;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .cb.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .row .t{flex:1;min-width:0;font-size:15px}
  .row.done .t{color:var(--ink-soft);text-decoration:line-through}
  .who{font-family:'Quicksand';font-weight:600;font-size:11.5px;padding:3px 9px;border-radius:99px;flex:none}
  .who.fede{background:#e3eefb;color:#2d5f92} .who.sara{background:#fbe8ef;color:#9c3d64}
  .who.tutti{background:var(--sage-bg);color:var(--sage)}
  .row .del{border:none;background:none;font-size:15px;padding:4px;cursor:pointer;opacity:.45}
  .add{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;
    font-family:'Inter';font-size:15px;background:var(--bg);outline:none}
  .add input:focus{border-color:var(--sage-soft)}
  .add button{border:none;background:var(--sage);color:#fff;border-radius:14px;width:46px;font-size:22px;cursor:pointer;flex:none}
  .seg{display:flex;gap:6px;padding:0 16px 12px}
  .seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:13px;padding:8px;border-radius:12px;cursor:pointer}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .add-card{display:block;width:100%;margin:14px 0 4px;padding:15px;border:1.5px dashed var(--line);
    border-radius:var(--r);background:var(--surface);color:var(--ink-soft);
    font-family:'Quicksand';font-weight:600;font-size:15px;cursor:pointer}
  .empty{text-align:center;color:var(--ink-soft);padding:34px 20px;font-size:14.5px}
  .empty .e{font-size:38px;display:block;margin-bottom:10px}

  /* foglio poppata */
  .scrim{position:fixed;inset:0;background:rgba(38,52,42,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
  .scrim.on{display:flex}
  .sheet{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:560px;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.22,1,.36,1);
    max-height:88dvh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h3{font-family:'Quicksand';font-weight:700;font-size:20px;text-align:center;margin-bottom:4px}
  .sheet .hint{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
  .lbl{font-family:'Quicksand';font-weight:700;font-size:12px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
  .opts{display:flex;gap:8px}
  .opts button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
    font-family:'Quicksand';font-weight:600;font-size:14.5px;padding:13px 8px;border-radius:15px;cursor:pointer}
  .opts button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .fld{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;background:var(--bg)}
  .fld input{flex:1;border:none;background:none;outline:none;padding:13px 0;font-family:'Inter';font-size:16px;color:var(--ink)}
  .fld .u{color:var(--ink-soft);font-size:14px}
  .sheet .go{width:100%;border:none;background:var(--sage);color:#fff;border-radius:16px;padding:16px;
    font-family:'Quicksand';font-weight:700;font-size:16px;margin-top:22px;cursor:pointer}
  .sheet .cancel{width:100%;border:none;background:none;color:var(--ink-soft);padding:12px;margin-top:4px;
    font-family:'Quicksand';font-weight:600;font-size:14.5px;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:300}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:22px 10px 10px;line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"><svg viewBox="0 0 170 150" width="52" height="46" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c2e6cd"/><stop offset="1" stop-color="#8ec9a2"/>
          </linearGradient>
          <linearGradient id="hgl" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M85 124c-22 0-38-14-38-32 0-11 6-19 15-24 3-11 11-18 23-18s20 7 23 18c9 5 15 13 15 24 0 18-16 32-38 32z" fill="url(#hg)"/>
        <path d="M85 52c-11 0-19 7-22 17-6 4-11 9-13 15 8-9 20-15 35-15s27 6 35 15c-2-6-7-11-13-15-3-10-11-17-22-17z" fill="url(#hgl)"/>
        <path d="M85 52c1-6 5-10 10-9" stroke="#3f8a58" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="71" cy="85" r="4.6" fill="#26342a"/><circle cx="99" cy="85" r="4.6" fill="#26342a"/>
        <circle cx="72.4" cy="83.4" r="1.5" fill="#fff" opacity=".9"/><circle cx="100.4" cy="83.4" r="1.5" fill="#fff" opacity=".9"/>
        <path d="M77 101c4.5 4.5 11.5 4.5 16 0" stroke="#26342a" stroke-width="4.4" stroke-linecap="round" fill="none"/>
        <ellipse cx="60" cy="95" rx="6.5" ry="4.2" fill="#7cbf94" opacity=".55"/>
        <ellipse cx="110" cy="95" rx="6.5" ry="4.2" fill="#7cbf94" opacity=".55"/>
      </svg></div>
      <h1>Nido</h1>
      <div class="sub" id="sub">Il diario del bebè</div>
      <div class="sync"><span class="d" id="syncDot"></span><span id="syncTxt">Connessione…</span></div>
    </header>

    <div class="macro" id="macro"></div>
    <div id="view"></div>

    <p class="note">Diario condiviso · si sincronizza tra i telefoni 🌿</p>
  </div>

  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>

<script>
/* ============ Dati ============ */
const KEY="nido_v1";
let mem=null;
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return mem; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ mem=state; } scheduleCloudPush(); }

const DEFAULT_LISTS=[
  {id:"farmacia",  emoji:"💊", name:"Farmacia",  items:[]},
  {id:"cibo",      emoji:"🥣", name:"Cibo",      items:[]},
  {id:"accessori", emoji:"🧸", name:"Accessori", items:[]},
  {id:"vestiti",   emoji:"👕", name:"Vestiti",   items:[]}
];

let state = load() || {};
state.events = state.events || [];      // {id, type:'diaper'|'feed', at, kind, mode, side, ml, min, note}
state.tasks  = state.tasks  || [];      // {id, text, who:'fede'|'sara'|'tutti', done, at}
state.lists  = state.lists  || JSON.parse(JSON.stringify(DEFAULT_LISTS));
state.weights= state.weights|| [];      // {id, kg, at, note}
state.open   = state.open   || {};
state.openBebe= state.openBebe|| {};

let activeMacro = "bebe", editMode = false, taskWho = "tutti";

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1700); }

/* ============ Date ============ */
const dayKey = (ms)=>{ const d=new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayShort=(ms)=>{ const d=new Date(ms); const t=dayKey(Date.now());
  if(dayKey(ms)===t) return "oggi";
  return d.getDate()+"/"+(d.getMonth()+1); };
const hhmm   = (ms)=>{ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function dayLabel(key){
  const t=dayKey(Date.now()), y=dayKey(Date.now()-86400000);
  if(key===t) return "Oggi";
  if(key===y) return "Ieri";
  const [Y,M,D]=key.split("-");
  return new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"numeric",month:"long"}).format(new Date(+Y,+M-1,+D));
}
function sinceLabel(ms){
  const m=Math.round((Date.now()-ms)/60000);
  if(m<1) return "adesso";
  if(m<60) return m+" min fa";
  const h=Math.floor(m/60);
  return h+"h "+(m%60?(m%60)+"m ":"")+"fa";
}

/* ============ Macro ============ */
const MACROS=[{id:"bebe",label:"👶 Bebè"},{id:"fare",label:"✅ Da fare"},{id:"liste",label:"🛒 Liste"}];
function buildMacro(){
  const el=document.getElementById("macro"); el.innerHTML="";
  MACROS.forEach(m=>{
    const b=document.createElement("button");
    b.className = m.id===activeMacro ? "active" : "";
    b.textContent=m.label;
    b.onclick=()=>{ activeMacro=m.id; editMode=false; buildMacro(); render(); };
    el.appendChild(b);
  });
}

/* ============ BEBÈ ============ */
const KINDS={ pipi:{e:"💧",t:"Pipì"}, pupu:{e:"💩",t:"Pupù"}, both:{e:"💧💩",t:"Pipì e pupù"} };

/* ---- Foglio unico per registrare un evento: sempre con data e ora modificabili ---- */
let draft=null;
function nowParts(){
  const d=new Date();
  return { date: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
           time: String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") };
}
function openEvent(type){
  const n=nowParts();
  draft={ type:type, kind:"pipi", mode:"seno", side:"sx", date:n.date, time:n.time };
  renderSheetEvent();
  document.getElementById("scrim").classList.add("on");
}
function closeSheet(){ document.getElementById("scrim").classList.remove("on"); draft=null; }

function renderSheetEvent(){
  const f=draft, s=document.getElementById("sheet");
  const titolo = f.type==="diaper" ? "Cambio" : f.type==="feed" ? "Poppata" : "Vomito";
  const hint   = f.type==="diaper" ? "Cosa ha fatto" : f.type==="feed" ? "Come ha mangiato" : "Quando è successo";

  let campi="";
  if(f.type==="diaper"){
    campi = '<div class="lbl">Tipo</div><div class="opts" id="dkind">'
      + '<button data-k="pipi" class="'+(f.kind==="pipi"?"on":"")+'">💧 Pipì</button>'
      + '<button data-k="pupu" class="'+(f.kind==="pupu"?"on":"")+'">💩 Pupù</button>'
      + '<button data-k="both" class="'+(f.kind==="both"?"on":"")+'">Entrambi</button></div>';
  } else if(f.type==="feed"){
    campi = '<div class="lbl">Modo</div><div class="opts" id="fmode">'
      + '<button data-m="seno" class="'+(f.mode==="seno"?"on":"")+'">🤱 Seno</button>'
      + '<button data-m="biberon" class="'+(f.mode==="biberon"?"on":"")+'">🍼 Biberon</button>'
      + '<button data-m="solido" class="'+(f.mode==="solido"?"on":"")+'">🥄 Solido</button></div>'
      + (f.mode==="seno"
          ? '<div class="lbl">Lato</div><div class="opts" id="fside">'
            + '<button data-s="sx" class="'+(f.side==="sx"?"on":"")+'">Sinistro</button>'
            + '<button data-s="dx" class="'+(f.side==="dx"?"on":"")+'">Destro</button>'
            + '<button data-s="due" class="'+(f.side==="due"?"on":"")+'">Entrambi</button></div>'
            + '<div class="lbl">Durata</div><div class="fld"><input id="fmin" type="number" inputmode="numeric" placeholder="minuti"><span class="u">min</span></div>'
          : f.mode==="biberon"
          ? '<div class="lbl">Quantità</div><div class="fld"><input id="fml" type="number" inputmode="numeric" placeholder="quanti ml"><span class="u">ml</span></div>'
          : '<div class="lbl">Cosa</div><div class="fld"><input id="fcosa" type="text" placeholder="es. pappa di verdure"></div>');
  } else {
    campi = '<div class="lbl">Quanto</div><div class="opts" id="vamt">'
      + '<button data-v="poco" class="'+(f.amount==="poco"?"on":"")+'">Poco</button>'
      + '<button data-v="medio" class="'+(f.amount==="medio"?"on":"")+'">Medio</button>'
      + '<button data-v="tanto" class="'+(f.amount==="tanto"?"on":"")+'">Tanto</button></div>';
  }

  s.innerHTML = '<h3>'+titolo+'</h3><div class="hint">'+hint+'</div>'
    + campi
    + '<div class="lbl">Giorno e ora</div>'
    + '<div class="opts"><div class="fld" style="flex:1.4"><input id="edate" type="date" value="'+f.date+'"></div>'
    + '<div class="fld" style="flex:1"><input id="etime" type="time" value="'+f.time+'"></div></div>'
    + '<div class="lbl">Nota</div><div class="fld"><input id="enote" type="text" placeholder="facoltativa"></div>'
    + '<button class="go" id="ego">Registra</button>'
    + '<button class="cancel" id="ecancel">Annulla</button>';

  const keep=()=>{ const d=s.querySelector("#edate"), t=s.querySelector("#etime"); if(d) draft.date=d.value; if(t) draft.time=t.value; };
  const kd=s.querySelector("#dkind");  if(kd) kd.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.kind=b.dataset.k; renderSheetEvent(); });
  const fm=s.querySelector("#fmode");  if(fm) fm.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.mode=b.dataset.m; renderSheetEvent(); });
  const fs=s.querySelector("#fside");  if(fs) fs.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.side=b.dataset.s; renderSheetEvent(); });
  const va=s.querySelector("#vamt");   if(va) va.querySelectorAll("button").forEach(b=> b.onclick=()=>{ keep(); draft.amount=b.dataset.v; renderSheetEvent(); });

  s.querySelector("#ego").onclick=()=>{
    keep();
    const at = draft.date ? new Date(draft.date+"T"+(draft.time||"12:00")).getTime() : Date.now();
    const note=(s.querySelector("#enote")||{}).value||"";
    const ev={ id:uid(), type:draft.type, at:at, note:note.trim() };
    if(draft.type==="diaper"){ ev.kind=draft.kind; }
    else if(draft.type==="feed"){
      const min=s.querySelector("#fmin"), ml=s.querySelector("#fml"), cosa=s.querySelector("#fcosa");
      ev.mode=draft.mode;
      ev.side=draft.mode==="seno"?draft.side:null;
      ev.min=min?(parseInt(min.value,10)||null):null;
      ev.ml=ml?(parseInt(ml.value,10)||null):null;
      if(cosa && cosa.value.trim()) ev.note=cosa.value.trim();
    } else { ev.amount=draft.amount||null; }
    state.events.unshift(ev);
    state.events.sort((a,b)=>b.at-a.at);
    save(); closeSheet(); render();
    toast(draft && draft.type==="diaper" ? "Cambio registrato" : draft && draft.type==="feed" ? "Poppata registrata" : "Registrato");
  };
  s.querySelector("#ecancel").onclick=closeSheet;
}
function feedText(e){
  if(e.mode==="seno")    return "Seno"+(e.side==="due"?" · entrambi":e.side==="dx"?" · destro":" · sinistro")+(e.min?" · "+e.min+" min":"");
  if(e.mode==="biberon") return "Biberon"+(e.ml?" · "+e.ml+" ml":"");
  return "Solido"+(e.note?" · "+e.note:"");
}
function delEvent(id){ state.events=state.events.filter(e=>e.id!==id); save(); render(); }

function renderBebe(){
  const v=document.getElementById("view");
  const today=dayKey(Date.now());
  const ev=state.events.slice().sort((a,b)=>b.at-a.at);
  const todays=ev.filter(e=>dayKey(e.at)===today);
  const nDiaper=todays.filter(e=>e.type==="diaper").length;
  const nFeed=todays.filter(e=>e.type==="feed").length;
  const nVomit=todays.filter(e=>e.type==="vomit").length;
  const w=state.weights.slice().sort((a,b)=>b.at-a.at);

  const SCHEDE=[
    { k:"feed",   emoji:"🍼", titolo:"Poppata", oggi:nFeed,   righe:ev.filter(e=>e.type==="feed"),
      bg:"#e4f2e8", fg:"#3f8a58" },
    { k:"vomit",  emoji:"🤢", titolo:"Vomito",  oggi:nVomit,  righe:ev.filter(e=>e.type==="vomit"),
      bg:"#f7e9dd", fg:"#a2703f" },
    { k:"diaper", emoji:"🧷", titolo:"Cambio",  oggi:nDiaper, righe:ev.filter(e=>e.type==="diaper"),
      bg:"#fbf1d8", fg:"#9a7b16" },
    { k:"weight", emoji:"⚖️", titolo:"Peso",    oggi:null,    righe:w,
      bg:"#e3edf6", fg:"#4f7ea3" }
  ];
  const sel = state.bebeTab || null;

  let h='<div class="schede">';
  SCHEDE.forEach(x=>{
    h += '<button class="scheda'+(sel===x.k?" on":"")+'" data-tab="'+x.k+'" style="--catbg:'+x.bg+';--cat:'+x.fg+'">'
      + '<span class="ic">'+x.emoji+'</span>'
      + '<span class="ti">'+x.titolo+'</span>'
      + '<span class="nm">'+(x.k==="weight" ? (w.length?fmtKg(w[0].kg)+" kg":"—") : (x.oggi?x.oggi+" oggi":"—"))+'</span>'
      + '</button>';
  });
  h += '</div>';

  if(!sel){
    h += '<div class="empty" style="padding:40px 20px"><span class="e">👶</span>'
      + 'Tocca una scheda qui sopra<br>per vedere e aggiungere gli eventi.</div>';
  } else {
    const x=SCHEDE.find(z=>z.k===sel);
    h += '<div class="card cat" style="--catbg:'+x.bg+';--cat:'+x.fg+'"><div class="card-head" style="cursor:default">'
      + '<div class="card-emoji">'+x.emoji+'</div>'
      + '<div class="card-title"><h2>'+x.titolo+'</h2><div class="meta">'
      + (x.k==="weight" ? (w.length? w.length+" pesate · ultima "+fmtDate(w[0].at) : "nessuna pesata")
                        : (x.righe.length? x.righe.length+" in tutto · "+(x.oggi||0)+" oggi" : "ancora niente"))
      + '</div></div>'
      + '<button class="sez-add" data-new="'+x.k+'" aria-label="Aggiungi">+</button></div>';

    if(!x.righe.length){
      h += '<div class="empty" style="padding:26px 16px"><span class="e">🌙</span>Ancora niente qui.<br>Tocca + per aggiungere.</div>';
    } else if(x.k==="weight"){
      x.righe.slice(0,40).forEach((it,i)=>{
        const prev=x.righe[i+1];
        const diff=prev ? (it.kg>=prev.kg?"+":"−")+Math.abs(Math.round((it.kg-prev.kg)*1000))+" g" : "prima pesata";
        h += '<div class="ev"><div class="dot">⚖️</div>'
          + '<div class="txt"><b>'+fmtKg(it.kg)+' kg</b><span>'+fmtDate(it.at)+(it.note?" · "+esc(it.note):"")+'</span></div>'
          + '<div class="time">'+diff+'</div>'
          + '<button class="del" data-wdel="'+it.id+'">🗑</button></div>';
      });
    } else {
      x.righe.slice(0,60).forEach(e=>{
        let tit;
        if(e.type==="feed")       tit=(e.mode==="seno"?"🤱 ":e.mode==="biberon"?"🍼 ":"🥄 ")+feedText(e);
        else if(e.type==="vomit") tit="Vomito"+(e.amount?" · "+e.amount:"");
        else                      tit=(KINDS[e.kind]||KINDS.pipi).e+" "+(KINDS[e.kind]||KINDS.pipi).t;
        h += '<div class="ev"><div class="dot">'+dayShort(e.at)+'</div>'
          + '<div class="txt"><b>'+tit+'</b>'+(e.note?'<span>'+esc(e.note)+'</span>':'')+'</div>'
          + '<div class="time">'+hhmm(e.at)+'</div>'
          + '<button class="del" data-del="'+e.id+'">🗑</button></div>';
      });
    }
    h += '</div>';
  }

  v.innerHTML=h;

  v.querySelectorAll("[data-tab]").forEach(b=> b.onclick=()=>{
    state.bebeTab = (state.bebeTab===b.dataset.tab) ? null : b.dataset.tab;
    save(); render();
  });
  v.querySelectorAll("[data-new]").forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    if(b.dataset.new==="weight") openWeight(); else openEvent(b.dataset.new);
  });
  v.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{ if(confirm("Eliminare questa voce?")) delEvent(b.dataset.del); });
  v.querySelectorAll("[data-wdel]").forEach(b=> b.onclick=()=>{
    if(confirm("Eliminare questa pesata?")){ state.weights=state.weights.filter(z=>z.id!==b.dataset.wdel); save(); render(); }
  });
}

/* ---- Peso ---- */
function fmtKg(kg){ return (Math.round(kg*1000)/1000).toString().replace(".",","); }
function fmtDate(ms){ return new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"long",year:"numeric"}).format(new Date(ms)); }
function openWeight(){
  const s=document.getElementById("sheet");
  const oggi=new Date(); const iso=oggi.getFullYear()+"-"+String(oggi.getMonth()+1).padStart(2,"0")+"-"+String(oggi.getDate()).padStart(2,"0");
  s.innerHTML =
    '<h3>Pesata</h3><div class="hint">Peso e giorno della misurazione</div>'
    + '<div class="lbl">Peso</div><div class="fld"><input id="wkg" type="number" inputmode="decimal" step="0.01" placeholder="es. 3,45"><span class="u">kg</span></div>'
    + '<div class="lbl">Giorno</div><div class="fld"><input id="wdate" type="date" value="'+iso+'"></div>'
    + '<div class="lbl">Nota</div><div class="fld"><input id="wnote" type="text" placeholder="es. visita dal pediatra"></div>'
    + '<button class="go" id="wgo">Registra pesata</button>'
    + '<button class="cancel" id="wcancel">Annulla</button>';
  document.getElementById("scrim").classList.add("on");
  s.querySelector("#wgo").onclick=()=>{
    const kg=parseFloat(String(s.querySelector("#wkg").value).replace(",","."));
    if(!kg || kg<=0){ toast("Scrivi il peso"); return; }
    const d=s.querySelector("#wdate").value;
    const at=d ? new Date(d+"T12:00").getTime() : Date.now();
    state.weights.unshift({id:uid(), kg:kg, at:at, note:s.querySelector("#wnote").value.trim()});
    state.weights.sort((a,b)=>b.at-a.at);
    save(); document.getElementById("scrim").classList.remove("on"); render(); toast("Pesata registrata");
  };
  s.querySelector("#wcancel").onclick=()=>document.getElementById("scrim").classList.remove("on");
}
/* ============ DA FARE ============ */
const WHO={fede:"Fede", sara:"Sara", tutti:"Tutti"};
function renderFare(){
  const v=document.getElementById("view");
  const open=state.tasks.filter(t=>!t.done), done=state.tasks.filter(t=>t.done);
  let h='<div class="card"><div class="add">'
    + '<input id="tnew" type="text" placeholder="Cosa c\'è da fare…"><button id="tadd">+</button></div>'
    + '<div class="seg" id="twho">'
      + Object.keys(WHO).map(k=>'<button data-w="'+k+'" class="'+(taskWho===k?"on":"")+'">'+WHO[k]+'</button>').join("")
    + '</div>';
  if(!state.tasks.length){
    h += '<div class="empty"><span class="e">📝</span>Ancora niente da fare.</div>';
  } else {
    open.forEach(t=>{ h += taskRow(t); });
    if(done.length){
      h += '<div class="daylabel" style="padding:0 16px">Fatte</div>';
      done.slice(0,20).forEach(t=>{ h += taskRow(t); });
    }
  }
  h += '</div>';
  v.innerHTML=h;

  v.querySelectorAll("#twho button").forEach(b=> b.onclick=()=>{ taskWho=b.dataset.w; render(); });
  const inp=v.querySelector("#tnew");
  const addFn=()=>{ const val=inp.value.trim(); if(!val) return;
    state.tasks.unshift({id:uid(), text:val, who:taskWho, done:false, at:Date.now()});
    inp.value=""; save(); render(); };
  v.querySelector("#tadd").onclick=addFn;
  inp.onkeydown=(e)=>{ if(e.key==="Enter") addFn(); };
  v.querySelectorAll("[data-tg]").forEach(b=> b.onclick=()=>{ const t=state.tasks.find(x=>x.id===b.dataset.tg); if(t){ t.done=!t.done; save(); render(); } });
  v.querySelectorAll("[data-tdel]").forEach(b=> b.onclick=()=>{ state.tasks=state.tasks.filter(x=>x.id!==b.dataset.tdel); save(); render(); });
}
function taskRow(t){
  return '<div class="row'+(t.done?" done":"")+'">'
    + '<button class="cb'+(t.done?" on":"")+'" data-tg="'+t.id+'">'+(t.done?"✓":"")+'</button>'
    + '<div class="t">'+esc(t.text)+'</div>'
    + '<span class="who '+t.who+'">'+WHO[t.who]+'</span>'
    + '<button class="del" data-tdel="'+t.id+'">🗑</button></div>';
}

/* ============ LISTE ============ */
function renderListe(){
  const v=document.getElementById("view");
  let h='<div class="chips">'
    + '<button class="chip chip-edit'+(editMode?" active":"")+'" id="ledit">'+(editMode?"Fine":"Modifica")+'</button>'
    + '</div>';
  if(!state.lists.length){
    h += '<div class="empty"><span class="e">🧺</span>Nessuna sezione.</div>';
  }
  state.lists.forEach(l=>{
    const done=l.items.filter(i=>i.done).length;
    const open = state.open[l.id] !== false;
    h += '<div class="card"><div class="card-head" data-open="'+l.id+'">'
      + '<div class="card-emoji">'+l.emoji+'</div>'
      + '<div class="card-title"><h2>'+esc(l.name)+'</h2><div class="meta">'+(l.items.length?done+" di "+l.items.length+" presi":"vuota")+'</div></div>'
      + (editMode?'<button class="card-del" data-ldel="'+l.id+'">🗑</button>':'<div class="card-count">'+done+"/"+l.items.length+'</div>')
      + '</div>';
    if(open){
      l.items.forEach(i=>{
        h += '<div class="row'+(i.done?" done":"")+'">'
          + '<button class="cb'+(i.done?" on":"")+'" data-ig="'+l.id+"::"+i.id+'">'+(i.done?"✓":"")+'</button>'
          + '<div class="t">'+esc(i.text)+'</div>'
          + '<button class="del" data-idel="'+l.id+"::"+i.id+'">🗑</button></div>';
      });
      h += '<div class="add"><input type="text" data-inew="'+l.id+'" placeholder="Aggiungi…"><button data-iadd="'+l.id+'">+</button></div>';
    }
    h += '</div>';
  });
  if(editMode) h += '<button class="add-card" id="laddcard">＋ Nuova sezione</button>';
  v.innerHTML=h;

  v.querySelector("#ledit").onclick=()=>{ editMode=!editMode; render(); };
  v.querySelectorAll("[data-open]").forEach(el=> el.onclick=(e)=>{
    if(e.target.closest("[data-ldel]")) return;
    const id=el.dataset.open; state.open[id] = state.open[id]===false ? true : false; save(); render();
  });
  v.querySelectorAll("[data-ldel]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation();
    const l=state.lists.find(x=>x.id===b.dataset.ldel);
    if(l && confirm('Eliminare la sezione "'+l.name+'" e tutto il suo contenuto?')){
      state.lists=state.lists.filter(x=>x.id!==b.dataset.ldel); save(); render();
    }
  });
  v.querySelectorAll("[data-ig]").forEach(b=> b.onclick=()=>{
    const [lid,iid]=b.dataset.ig.split("::"); const l=state.lists.find(x=>x.id===lid);
    const it=l&&l.items.find(x=>x.id===iid); if(it){ it.done=!it.done; save(); render(); }
  });
  v.querySelectorAll("[data-idel]").forEach(b=> b.onclick=()=>{
    const [lid,iid]=b.dataset.idel.split("::"); const l=state.lists.find(x=>x.id===lid);
    if(l){ l.items=l.items.filter(x=>x.id!==iid); save(); render(); }
  });
  v.querySelectorAll("[data-iadd]").forEach(b=> b.onclick=()=>addItem(b.dataset.iadd));
  v.querySelectorAll("[data-inew]").forEach(i=> i.onkeydown=(e)=>{ if(e.key==="Enter") addItem(i.dataset.inew); });
  const ac=v.querySelector("#laddcard");
  if(ac) ac.onclick=()=>{
    const name=(prompt("Nome della nuova sezione (es. Pannolini)")||"").trim(); if(!name) return;
    const emoji=(prompt("Un'emoji (invio per 📦)")||"").trim()||"📦";
    state.lists.push({id:uid(), emoji:emoji, name:name, items:[]}); save(); render(); toast("Sezione aggiunta");
  };
}
function addItem(lid){
  const inp=document.querySelector('[data-inew="'+lid+'"]'); if(!inp) return;
  const val=inp.value.trim(); if(!val) return;
  const l=state.lists.find(x=>x.id===lid); if(!l) return;
  l.items.push({id:uid(), text:val, done:false});
  inp.value=""; save(); render();
  const again=document.querySelector('[data-inew="'+lid+'"]'); if(again) again.focus();
}

/* ============ Render ============ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function render(){
  if(activeMacro==="bebe") renderBebe();
  else if(activeMacro==="fare") renderFare();
  else renderListe();
  const t=state.events.filter(e=>dayKey(e.at)===dayKey(Date.now()));
  document.getElementById("sub").textContent =
    activeMacro==="bebe" ? (t.length? "Oggi: "+t.filter(e=>e.type==="feed").length+" poppate · "+t.filter(e=>e.type==="diaper").length+" cambi" : "Il diario del bebè")
    : activeMacro==="fare" ? "Compiti di Fede e Sara" : "Cosa serve al nido";
}
document.getElementById("scrim").onclick=(e)=>{ if(e.target.id==="scrim") closeSheet(); };

const FB_CONFIG={
  apiKey:            "AIzaSyDLbGyLrPaw3tQXY3HOaTxWJLnOWPUjvXU",
  authDomain:        "cicogna-57ae0.firebaseapp.com",
  projectId:         "cicogna-57ae0",
  storageBucket:     "cicogna-57ae0.firebasestorage.app",
  messagingSenderId: "1013139034396",
  appId:             "1:1013139034396:web:4770893e05130ca600aad9"
};
const ROOM_COL="nido_rooms", ROOM_DOC="casa";     // ← dati SEPARATI da quelli di Cicogna
const SYNC_KEYS=["events","tasks","lists","weights"];
const SYNC_INIT="nido_sync_init";
let FB=null, fdoc=null, fbReady=false, pendingWrite=false, dirty=false, pushTimer=null;

function setConn(kind,label){
  const d=document.getElementById("syncDot"), t=document.getElementById("syncTxt");
  if(d) d.className="d "+kind;
  if(t&&label) t.textContent=label;
}
function syncedSubset(s){ const o={}; SYNC_KEYS.forEach(k=> o[k]= s[k]!=null ? s[k] : []); return o; }
function scheduleCloudPush(){
  if(!fbReady) return;
  dirty=true; clearTimeout(pushTimer);
  pushTimer=setTimeout(cloudPush, 700);
}
async function cloudPush(){
  if(!fbReady) return;
  pendingWrite=true;
  try{ await FB.setDoc(fdoc, syncedSubset(state)); dirty=false; }
  catch(e){ console.warn("push", e); }
  pendingWrite=false;
}
function mergeUnion(local, server){
  const out={};
  const byId=(a,b)=>{ const m={}; [...(a||[]),...(b||[])].forEach(x=>{ if(x&&x.id) m[x.id]=x; }); return Object.values(m); };
  out.events = byId(server.events, local.events).sort((a,b)=>b.at-a.at);
  out.tasks  = byId(server.tasks,  local.tasks);
  out.weights= byId(server.weights,local.weights).sort((a,b)=>b.at-a.at);
  const lm={};
  [...(server.lists||[]), ...(local.lists||[])].forEach(l=>{
    if(!l||!l.id) return;
    if(!lm[l.id]) lm[l.id]={id:l.id, emoji:l.emoji, name:l.name, items:[...(l.items||[])]};
    else{
      const seen=new Set(lm[l.id].items.map(i=>i.id));
      (l.items||[]).forEach(i=>{ if(!seen.has(i.id)){ lm[l.id].items.push(i); seen.add(i.id); } });
    }
  });
  out.lists=Object.values(lm);
  return out;
}
async function initSync(){
  try{
    setConn("wait","Connessione…");
    const appMod = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js");
    FB           = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js");
    const app = appMod.initializeApp(FB_CONFIG);
    fdoc = FB.doc(FB.getFirestore(app), ROOM_COL, ROOM_DOC);
    fbReady = true;
    FB.onSnapshot(fdoc, {includeMetadataChanges:true},
      (snap)=>{
        if(snap.metadata.fromCache){ setConn("wait","Offline · solo questo telefono"); return; }
        setConn("on","Sincronizzato ✓");
        if(pendingWrite || dirty) return;
        const data = snap.exists() ? snap.data() : null;
        const first = !localStorage.getItem(SYNC_INIT);
        if(!data){ cloudPush(); }
        else if(first){ const m=mergeUnion(state,data); SYNC_KEYS.forEach(k=> state[k]=m[k]); save(); }
        else { SYNC_KEYS.forEach(k=>{ if(data[k]!=null) state[k]=data[k]; }); try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
        localStorage.setItem(SYNC_INIT,"1");
        render();
      },
      (err)=>{ setConn("off","Sync non disponibile"); console.warn("Sync:", err); }
    );
  }catch(e){ setConn("off","Sync non disponibile"); console.warn("Sync non attivo:", e); }
}

/* ============ Avvio ============ */
buildMacro();
render();
initSync();
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
